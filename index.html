<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Awful Space</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=VT323&family=Nanum+Gothic+Coding&family=Nanum+Myeongjo:wght@800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#000;overflow:hidden;font-family:'Nanum Gothic Coding',monospace;color:#d8cfa8;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent}
canvas{position:fixed;inset:0;width:100%;height:100%;touch-action:none}

/* 게임 HUD */
#hud{position:fixed;top:0;left:0;right:0;display:none;justify-content:space-between;padding:12px 16px;pointer-events:none;text-shadow:0 0 4px #000;z-index:2}
#clock{font-family:VT323,monospace;font-size:30px;line-height:1}
#night{font-size:12px;opacity:.6;margin-top:2px}
.bars{text-align:right;font-size:12px;opacity:.85}
.bar{width:110px;height:4px;background:rgba(60,55,30,.6);margin:4px 0 7px auto}
.bar i{display:block;height:100%;background:#cbb85a}
#msg{position:fixed;left:0;right:0;bottom:92px;text-align:center;font-size:15px;transition:opacity .8s;opacity:0;pointer-events:none;padding:0 16px;text-shadow:0 0 6px #000;z-index:2}
#acts{position:fixed;left:0;right:0;bottom:16px;display:none;flex-wrap:wrap;justify-content:center;gap:8px;padding:0 16px;z-index:2}
button{font:inherit;font-size:15px;color:#d8cfa8;background:rgba(12,11,6,.75);border:1px solid rgba(120,110,60,.6);padding:10px 14px;min-width:44px;min-height:44px;cursor:pointer}
button.on{background:rgba(120,110,60,.85);color:#111}
.nav{display:none!important}
#lb{left:4px}#rb{right:4px}
body[data-mode=game] #hud{display:flex}
body[data-mode=game] #acts{display:flex}
body:not([data-mode=game]) #msg{display:none}

/* 오버레이 */
.ov{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;flex-direction:column;align-items:center;justify-content:center;padding:24px;text-align:center;gap:16px;z-index:5}
.ov.show{display:flex}
.ov pre{white-space:pre-wrap;font:inherit;line-height:1.8;max-width:520px;text-align:left;margin:0}
#log{background:rgba(205,195,158,.97);color:#2a2410}
#log pre{font-size:15px}
#log button{color:#2a2410;background:transparent;border-color:#2a2410}
#end h1{font-family:VT323,monospace;font-size:56px;margin:0;letter-spacing:6px}
#end pre{text-align:center;opacity:.8}
#intro{background:#000;font-family:VT323,monospace;pointer-events:none}
#intro .big{font-size:64px;letter-spacing:4px}
#intro .small{font-family:'Nanum Gothic Coding',monospace;font-size:18px;opacity:.7}
#intro.show{animation:introFade 2.4s forwards}
@keyframes introFade{0%{opacity:0}15%{opacity:1}75%{opacity:1}100%{opacity:0}}

/* 메인 메뉴 */
#menu{position:fixed;inset:0;z-index:4;display:none;flex-direction:column;justify-content:center;padding:6vh 9vw;gap:4px}
body[data-mode=menu] #menu{display:flex}
#menu h1{font-family:'Nanum Myeongjo',serif;font-weight:800;font-size:clamp(36px,7.2vw,86px);letter-spacing:.12em;color:#ddd5b4;margin:0;text-shadow:0 0 22px rgba(255,240,180,.12);animation:flick 5s infinite}
#menu .sub{font-family:VT323,monospace;font-size:20px;letter-spacing:.5em;opacity:.45;margin:0 0 5vh 4px}
.mbtn{background:none;border:none;text-align:left;font-family:'Nanum Gothic Coding',monospace;font-size:clamp(19px,3vw,26px);color:#cfc8a8;opacity:.55;padding:6px 0;min-height:44px;cursor:pointer;width:max-content}
.mbtn:hover,.mbtn:focus-visible{opacity:1;outline:none}
.mbtn::before{content:'   ';white-space:pre;font-family:VT323,monospace}
.mbtn:hover::before{content:'>> '}
#menu .foot{position:fixed;left:9vw;bottom:18px;font-size:12px;opacity:.35}
.glitch{text-shadow:4px 0 rgba(255,30,30,.55),-4px 0 rgba(30,255,255,.45)!important;transform:translateX(3px) skewX(-4deg)}
@keyframes flick{0%,100%{opacity:1}41%{opacity:1}42%{opacity:.35}43%{opacity:1}70%{opacity:.9}71%{opacity:.2}72%{opacity:.85}}

/* 개발자 패널 */
#devp{background:rgba(0,0,0,.88);font-size:15px}
#devp h2{font-family:VT323,monospace;font-size:34px;margin:0;letter-spacing:4px}
#devp .row{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
#devp label{display:flex;gap:8px;align-items:center;min-height:36px;cursor:pointer}
#dbg{position:fixed;left:8px;top:64px;z-index:3;font-size:11px;line-height:1.45;background:rgba(0,0,0,.6);padding:6px 8px;border:1px solid rgba(120,110,60,.5);display:none;max-width:260px}
#dbg.min{background:none;border:none;padding:0}
#dbg.min pre,#dbg.min .row{display:none}
#dbgTog{font-size:11px;padding:2px 8px;min-height:28px;min-width:44px;background:rgba(0,0,0,.6)}
#dbg pre{margin:0;font:inherit;white-space:pre-wrap}
#dbg .row{display:flex;gap:4px;flex-wrap:wrap;margin-top:6px}
#dbg button{font-size:11px;padding:4px 7px;min-height:30px;min-width:30px}
#rot{display:none!important}
/* 세로 화면이면 body를 90도 돌려서 가로 게임 화면으로 (안의 fixed 요소는 body 기준이 됨) */
html.rot body{position:fixed;top:0;left:0;transform-origin:0 0;transform:rotate(90deg) translateY(-100%)}
#map{position:fixed;right:12px;bottom:12px;width:300px;height:225px;z-index:3;display:none;background:rgba(4,10,6,.62);border:1px solid rgba(170,220,170,.35)}
#map svg{position:absolute;inset:0;width:100%;height:100%}
#map .cb{position:absolute;transform:translate(-50%,-50%);font-family:VT323,monospace;font-size:15px;padding:0 6px;min-width:30px;min-height:24px;background:rgba(8,18,10,.9);border:1px solid rgba(170,220,170,.6);color:#cfe8cf}
#map .cb.on{background:#a8dca8;color:#061006}
#map .mlab{position:absolute;left:6px;top:3px;font:12px VT323,monospace;opacity:.6;color:#cfe8cf}
body:not([data-mode=game]) #map{display:none!important}
.scare #hud,.scare #dbg,.scare #map{display:none!important}
/* 배전반 미니게임 */
#brkp{background:rgba(6,6,4,.94);gap:14px}
#brkp .bpt{font-family:VT323,monospace;font-size:22px;letter-spacing:3px;opacity:.7}
#brkp .bhint{font-size:12px;opacity:.5}
#bsw{display:flex;gap:10px;padding:14px 16px;background:#1b1b17;border:2px solid #34342c}
#bsw .sw{width:46px;height:86px;padding:0;position:relative;background:#0c0c0a;border:1px solid #3a3a30;-webkit-touch-callout:none}
#bsw .sw .h{position:absolute;left:9px;right:9px;height:30px;background:linear-gradient(#6a6a60,#2c2c28);top:8px;transition:top .08s}
#bsw .sw.off .h{top:46px}
#bsw .sw .l{position:absolute;left:50%;bottom:-16px;width:7px;height:7px;margin-left:-3.5px;border-radius:50%;background:#1a1a1a}
#bsw .sw.on .l{background:#2c4;box-shadow:0 0 6px #2c4}
#bsw .sw.off .l{background:#e22;box-shadow:0 0 6px #e22;animation:bl .9s infinite}
#bsw .sw.dead .l{background:#1a1a1a;box-shadow:none;animation:none}
#bsw .sw .n{position:absolute;top:-18px;left:0;right:0;font:12px VT323,monospace;opacity:.5;color:#d8cfa8}
@keyframes bl{50%{opacity:.25}}
#blever{min-width:220px;min-height:56px;background:#3a0d0a;border-color:#7a2a20;touch-action:none;-webkit-touch-callout:none}
.bbar{height:6px;background:#222;margin-top:8px}.bbar i{display:block;height:100%;width:0;background:#e8c050}
#brkp.spark{background:rgba(255,230,150,.55)}
</style>
</head>
<body data-mode="menu">
<canvas id="cv"></canvas>

<div id="hud">
  <div><div id="clock">12 AM</div><div id="night"></div></div>
  <div class="bars">
    <div>전력 <span id="pw">100</span>%</div><div class="bar"><i id="pb"></i></div>
    <div>정신</div><div class="bar"><i id="sb"></i></div>
  </div>
</div>
<div id="msg"></div>
<button class="nav" id="lb">◀</button>
<button class="nav" id="rb">▶</button>
<div id="acts"></div>
<div id="map"></div>
<div id="dbg"><button id="dbgTog">DEV ▾</button><pre id="dbgText"></pre><div class="row" id="dbgBtns"></div></div>

<div id="menu">
  <h1 id="title">AWFUL SPACE</h1>
  <div class="sub">관측실 근무 기록</div>
  <button class="mbtn" id="mNew">새 근무 시작</button>
  <button class="mbtn" id="mCont">이어하기</button>
  <button class="mbtn" id="mDev">개발자 모드</button>
  <div class="foot">v0.4 · 이어폰 권장</div>
</div>

<div class="ov" id="devp">
  <h2>DEVELOPER MODE</h2>
  <div>시작할 일차</div>
  <div class="row" id="devNights"></div>
  <div>
    <label><input type="checkbox" id="dNoScare" checked> 점프스케어 끄기 (사망 시 글자만 표시)</label>
    <label><input type="checkbox" id="dInfo" checked> 디버그 정보 표시</label>
    <label><input type="checkbox" id="dGod"> 무적 (사망 판정 무시)</label>
    <label><input type="checkbox" id="dBright"> 밝게 보기</label>
  </div>
  <button id="devBack">메인 메뉴</button>
</div>

<div class="ov" id="intro"><div class="big" id="introBig">12:00 AM</div><div class="small" id="introSmall"></div></div>
<div class="ov" id="brkp"><div class="bpt">배전반 · MAIN BREAKER</div><div class="bhint">내려간 스위치를 모두 올린 뒤, 메인 레버를 끝까지 누르고 있기</div><div id="bsw"></div><div><button id="blever">메인 레버 (누르고 있기)</button><div class="bbar"><i id="bprog"></i></div></div><button id="bclose">닫기</button></div>
<div class="ov" id="log"><pre id="logText"></pre><button id="logClose">닫기</button></div>
<div class="ov" id="end"><h1 id="endTitle"></h1><pre id="endText"></pre><div style="display:flex;gap:8px"><button id="endBtn"></button><button id="endMenu">메인 메뉴</button></div></div>
<div id="rot">가로 모드로 플레이하는 걸 권장합니다</div>

<script>
// ===================== 기본 =====================
const $=id=>document.getElementById(id);
const cv=$('cv'),cx=cv.getContext('2d');
let W,H,DPR=1;
const rnd=(a,b)=>a+Math.random()*(b-a);
const ri=n=>Math.floor(Math.random()*n);
const lerp=(a,b,t)=>a+(b-a)*t;
const ease=t=>t<.5?2*t*t:1-Math.pow(-2*t+2,2)/2;
function mulberry(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function mk(w,h){const c=document.createElement('canvas');c.width=Math.max(1,Math.round(w));c.height=Math.max(1,Math.round(h));return c}
function polyG(g,p){g.beginPath();g.moveTo(p[0][0],p[0][1]);for(let i=1;i<p.length;i++)g.lineTo(p[i][0],p[i][1]);g.closePath();g.fill()}
function rr(g,x,y,w,h,r){g.beginPath();g.moveTo(x+r,y);g.arcTo(x+w,y,x+w,y+h,r);g.arcTo(x+w,y+h,x,y+h,r);g.arcTo(x,y+h,x,y,r);g.arcTo(x,y,x+w,y,r);g.closePath()}
function centroid(q){return[q.reduce((a,p)=>a+p[0],0)/q.length,q.reduce((a,p)=>a+p[1],0)/q.length]}
function shrink(q,k){const c=centroid(q);return q.map(p=>[c[0]+(p[0]-c[0])*k,c[1]+(p[1]-c[1])*k])}

const HOUR=60;          // 게임 1시간 = 실제 60초
const NIGHTS=5;
const CAMS=['A','B','C','D','E','F','G','H']; // A가 관측실 바로 앞
const CAMN=['관측실 앞 복도','굽은 복도','젖은 카펫 구역','기둥 홀','빈 사무실','기계실','끝없는 복도','???'];
const KIND=['corr','bend','wet','pillar','office','machine','endless','void'];
const ADJ=[[1,2],[0,3,4],[0,3,5],[1,2,6],[1,6],[2,7],[3,4,7],[5,6]]; // 구역 연결
const DIST=[0,1,1,2,2,2,3,3];   // 관측실까지 거리
const MAPP=[[50,52],[30,42],[70,42],[50,30],[13,26],[87,27],[30,12],[70,10]]; // 지도 위치
const DOOR=-1;

let S=null,last=0,jump=0,jumpType='',T_=0,menuT=0,mode='menu';
let savedNight=1;
try{savedNight=+localStorage.getItem('obs_night')||1}catch(e){}
const DEV={on:false,noScare:true,info:true,god:false,bright:false,speed:1};

// ===================== 텍스처 (한 번만 생성) =====================
const TX=256;
function noiseOn(g,w,h,r,amt){const d=g.getImageData(0,0,w,h),p=d.data;for(let i=0;i<p.length;i+=4){const n=(r()-.5)*255*amt;p[i]+=n;p[i+1]+=n;p[i+2]+=n}g.putImageData(d,0,0)}
function blot(g,x,y,rad,col){for(const dx of[-TX,0,TX])for(const dy of[-TX,0,TX]){const gr=g.createRadialGradient(x+dx,y+dy,0,x+dx,y+dy,rad);gr.addColorStop(0,col);gr.addColorStop(1,'rgba(0,0,0,0)');g.fillStyle=gr;g.fillRect(x+dx-rad,y+dy-rad,rad*2,rad*2)}}
function makeWall(){
  const c=mk(TX,TX),g=c.getContext('2d'),r=mulberry(7);
  g.fillStyle='#9a8944';g.fillRect(0,0,TX,TX);
  for(let x=0;x<TX;x+=16){g.fillStyle=x%32?'rgba(255,240,170,.05)':'rgba(60,50,10,.08)';g.fillRect(x,0,8,TX)}
  g.strokeStyle='rgba(90,75,25,.2)';g.lineWidth=1.5;
  for(let y=0;y<TX;y+=32)for(let x=0;x<TX;x+=32){g.beginPath();g.moveTo(x+16,y+6);g.lineTo(x+24,y+16);g.lineTo(x+16,y+26);g.lineTo(x+8,y+16);g.closePath();g.stroke()}
  for(let i=0;i<14;i++)blot(g,r()*TX,r()*TX,10+r()*50,`rgba(70,50,10,${.1+r()*.18})`);
  for(let i=0;i<12;i++){const x=r()*TX,len=40+r()*180;const gr=g.createLinearGradient(0,0,0,len);gr.addColorStop(0,'rgba(60,45,10,.22)');gr.addColorStop(1,'rgba(60,45,10,0)');g.fillStyle=gr;g.fillRect(x,0,1+r()*3,len)}
  g.fillStyle='rgba(255,245,200,.08)';g.fillRect(TX-3,0,2,TX);g.fillStyle='rgba(40,30,8,.25)';g.fillRect(TX-1,0,1,TX); // 벽지 이음새
  for(let i=0;i<6;i++)blot(g,r()*TX,r()*TX,4+r()*14,`rgba(40,55,20,${.12+r()*.15})`); // 곰팡이
  for(let i=0;i<40;i++){g.fillStyle=`rgba(30,40,15,${r()*.25})`;g.fillRect(r()*TX,r()*TX,1+r()*2,1+r()*2)}
  noiseOn(g,TX,TX,r,.12);return c;
}
function makeCarpet(){
  const c=mk(TX,TX),g=c.getContext('2d'),r=mulberry(11);
  g.fillStyle='#5a4d26';g.fillRect(0,0,TX,TX);
  for(let i=0;i<5000;i++){g.fillStyle=r()<.5?'rgba(35,28,10,.35)':'rgba(140,120,60,.16)';g.fillRect(r()*TX,r()*TX,1,1+r()*3)}
  for(let i=0;i<9;i++)blot(g,r()*TX,r()*TX,15+r()*45,`rgba(25,20,6,${.18+r()*.28})`);
  for(let i=0;i<300;i++){g.fillStyle=`rgba(20,16,6,${r()*.3})`;g.fillRect(r()*TX,r()*TX,r()*6,1)} // 눌린 자국
  noiseOn(g,TX,TX,r,.15);return c;
}
function makeCeil(){
  const c=mk(TX,TX),g=c.getContext('2d'),r=mulberry(13);
  g.fillStyle='#b0a474';g.fillRect(0,0,TX,TX);
  for(let i=0;i<1800;i++){g.fillStyle='rgba(80,70,40,.35)';g.fillRect(r()*TX,r()*TX,1.5,1.5)}
  g.fillStyle='rgba(60,52,25,.65)';for(let k=0;k<TX;k+=64){g.fillRect(k,0,3,TX);g.fillRect(0,k,TX,3)}
  for(let i=0;i<5;i++)blot(g,r()*TX,r()*TX,10+r()*35,`rgba(110,80,20,${.18+r()*.22})`);
  for(let i=0;i<3;i++){const x=Math.floor(r()*4)*64,y=Math.floor(r()*4)*64;g.fillStyle=`rgba(90,65,20,${.2+r()*.25})`;g.fillRect(x+3,y+3,61,61)} // 물 먹은 타일
  noiseOn(g,TX,TX,r,.08);return c;
}
function makeWood(){
  const c=mk(TX,TX),g=c.getContext('2d'),r=mulberry(17);
  g.fillStyle='#35261a';g.fillRect(0,0,TX,TX);
  for(let y=0;y<TX;y+=2){g.fillStyle=r()<.5?`rgba(15,8,3,${r()*.3})`:`rgba(110,75,40,${r()*.15})`;g.fillRect(0,y,TX,1+r()*2)}
  noiseOn(g,TX,TX,r,.06);return c;
}
function makeMetal(base,seed){
  const c=mk(TX,TX),g=c.getContext('2d'),r=mulberry(seed);
  g.fillStyle=base;g.fillRect(0,0,TX,TX);
  for(let i=0;i<70;i++){g.strokeStyle=`rgba(255,255,255,${r()*.07})`;g.beginPath();const x=r()*TX,y=r()*TX;g.moveTo(x,y);g.lineTo(x+r()*40-20,y+r()*8-4);g.stroke()}
  for(let i=0;i<12;i++){const x=r()*TX,y=r()*TX,len=20+r()*90;const gr=g.createLinearGradient(0,y,0,y+len);gr.addColorStop(0,'rgba(110,55,20,.4)');gr.addColorStop(1,'rgba(110,55,20,0)');g.fillStyle=gr;g.fillRect(x,y,2+r()*3,len)}
  noiseOn(g,TX,TX,r,.1);return c;
}
function tileC(src,nx,ny){const c=mk(TX*nx,TX*ny),g=c.getContext('2d');for(let i=0;i<nx;i++)for(let j=0;j<ny;j++)g.drawImage(src,i*TX,j*TX);return c}
const T={};
T.wall=makeWall();T.wallT=tileC(T.wall,1,2);
T.floorW=tileC(makeCarpet(),3,1);T.ceilW=tileC(makeCeil(),3,1);
T.wood=makeWood();T.metal=makeMetal('#454b44',19);T.metalG=makeMetal('#55574f',23);

function texRect(g,tex,x,y,w,h,s=1){g.save();g.beginPath();g.rect(x,y,w,h);g.clip();g.translate(x,y);g.scale(s,s);g.fillStyle=g.createPattern(tex,'repeat');g.fillRect(0,0,w/s+2,h/s+2);g.restore()}
function texPoly(g,tex,p,s=1){g.save();g.beginPath();g.moveTo(p[0][0],p[0][1]);p.slice(1).forEach(q=>g.lineTo(q[0],q[1]));g.closePath();g.clip();g.scale(s,s);g.fillStyle=g.createPattern(tex,'repeat');g.fillRect(-20,-20,4000/s,3000/s);g.restore()}

// 노이즈 패턴 (지지직)
const NOISE=[0,1,2,3].map(k=>{const c=mk(128,128),g=c.getContext('2d'),d=g.createImageData(128,128);for(let i=0;i<d.data.length;i+=4){const v=Math.random()*255;d.data[i]=d.data[i+1]=d.data[i+2]=v;d.data[i+3]=255}g.putImageData(d,0,0);return c});
const NPm=NOISE.map(c=>cx.createPattern(c,'repeat'));
const camC=mk(10,10),cg=camC.getContext('2d');
const NPc=NOISE.map(c=>cg.createPattern(c,'repeat'));

// ===================== 원근 방 그리기 =====================
const pu=(s,Z)=>(s/Z)/((1-s)+s/Z);       // 화면 위치 → 실제 깊이
const sOf=(u,Z)=>u*Z/(1+u*(Z-1));        // 실제 깊이 → 화면 위치
function geom(w,h,o){o=o||{};return{w,h,nx:-w*.1,ny:-h*.12,nw:w*1.2,nh:h*1.3,bx:w*(o.bx??.22),by:h*(o.by??.15),bw:w*(o.bw??.56),bh:h*(o.bh??.55)}}

    g.fillStyle='#000';g.beginPath();g.ellipse(0,120,48,105,0,0,7);g.fill();
    g.restore();
    for(let k=0;k<12;k++){const y=rnd(0,S2),h2=rnd(4,26);g.drawImage(c,0,y,S2,h2,rnd(-40,40),y,S2,h2)}
    jumpFin(g,S2);JUMP['정신']=c}
}

// ===================== 근무 일지 규칙 (5일 차 규칙은 거짓말) =====================
const BASE_RULES='전력을 아낄 것. 차단기가 내려가면 오른쪽 배전반에서 올릴 것.\n오전 6시까지 자리를 지킬 것.';
const RULES=[
  '형광등 소리가 멈추면 즉시 문을 잠글 것. 소리가 돌아오면 열어도 된다.',
  '모니터 속에서 눈이 보이면 다른 구역으로 넘길 것. 오래 보지 말 것.',
  '조명을 끄지 말 것. 어둠은 가까이 온다.',
  '모니터 속에 "당신"이 앉아 있다면 전화로 신고할 것. 없는 것을 신고하지 말 것.',
  '오늘은 교대 인원이 도착한다. 문을 열어둘 것.'
];
const DEATH={
  '교대자':'문이 열려 있었다.',
  '응시자':'너무 오래 바라봤다.',
  '그림자':'어둠이 닿았다.',
  '정신':'더 이상 무엇이 진짜인지 모르겠다.'
};

// ===================== 상태 =====================
function setMode(m){mode=m;document.body.dataset.mode=m;$('dbg').style.display=(m==='game'&&DEV.on&&DEV.info)?'block':'none'}
function newNight(n){
  S={night:n,t:0,power:100,san:100,view:1,mon:false,cam:0,door:false,light:true,brk:true,
     log:false,paused:true,over:false,msgT:0,shake:0,outSaid:false,silT:0,humOn:null,
     camX:1,monA:0,camSw:0,ring:0,ringT:rnd(60,150),monMsg:null,clockRev:0,sub:0,rattleT:0,h3:false,sw:Array(6).fill(true),dead:-1,bp:false,holding:false,hold:0,lockT:0,flickT:0,flOn:true,peek:null,ambT:rnd(6,12),hbT:0,dgT:0,
     layout:CAMS.map((_,i)=>({kind:KIND[i],ox:rnd(-.08,.08),oy:rnd(-.04,.04),seed:ri(1e9)})), // 밤마다 공간 구조가 바뀜
     hum:{node:[5,6,7][ri(3)],spot:0,timer:rnd(10,16),wait:0,lock:0},
     gaze:{cam:ri(8),p:0,timer:15},
     shadow:{p:0},
     clone:{cam:-1,t:0,timer:rnd(15,25)},
     fake:{cam:-1,type:'hum',timer:5}};
  buildCams();
  ['end','start','devp','log','brkp'].forEach(id=>$(id)&&$(id).classList.remove('show'));
  jump=0;document.body.classList.remove('scare');setMode('game');buildUI();updHUD();
  // 밤 시작 연출 → 근무 일지 → 닫으면 시간이 흐름
  $('introSmall').textContent=n+'일 차';
  const it=$('intro');it.classList.remove('show');void it.offsetWidth;it.classList.add('show');
  setTimeout(()=>{it.classList.remove('show');if(S&&S.night===n&&!S.over)openLog()},DEV.on?700:2400);
}
const powered=()=>S.brk&&S.power>0;
const lightOn=()=>S.light&&powered();
const doorOn=()=>S.door&&powered();
const monOn=()=>S.mon&&powered();
const lightVis=()=>lightOn()&&S.flOn;

// ===================== 업데이트 (게임 규칙) =====================
function update(dt){
  if(S.over)return;
  S.t+=dt;
  if(S.t>=HOUR*6){win();return}

  // 전력
  if(powered()){
    const d=.05+(S.light?.14:0)+(S.mon?.1:0)+(S.door?.25:0);
    S.power=Math.max(0,S.power-d*dt);
  }
  if(S.power<=0&&!S.outSaid){S.outSaid=true;say('전력이 다 떨어졌다...');sfx(50,1.5,'sawtooth',.2)}
  if(S.mon&&!powered()){S.mon=false;buildUI()}

  // 차단기
  if(S.brk&&S.power>0&&Math.random()<dt*.004*S.night){
    S.brk=false;S.sw=Array(6).fill(true);for(let k=0,n=Math.min(5,1+S.night);k<n;){const i=ri(6);if(S.sw[i]){S.sw[i]=false;k++}}S.dead=S.night>=3?ri(6):-1;say('딸깍. 차단기가 내려갔다.');sfx(90,.3,'square',.2);buildUI();
  }

  // 교대자: 지도를 따라 관측실로 다가옴. 문 앞에 서면 형광등 소리가 끊김
  const h=S.hum;
  if(h.node!==DOOR){
    h.timer-=dt;
    if(h.timer<=0){
      h.timer=Math.max(3.5,rnd(7,12)-S.night);
      const prev=h.node;
      if(h.spot<2&&Math.random()<.45)h.spot++;            // 같은 구역에서 카메라 쪽으로 다가옴
      else if(h.node===0){h.node=DOOR;h.wait=0;h.lock=0}  // A에서 문 앞으로
      else{const nb=ADJ[h.node],w=nb.map(n=>DIST[n]<DIST[h.node]?3+S.night*.5:1);let r=Math.random()*w.reduce((a,b)=>a+b,0),k=0;while(k<w.length-1&&r>w[k]){r-=w[k];k++}h.node=nb[k];h.spot=0}
      humMoved(prev);
    }
  }else{
    if(doorOn()){
      h.lock+=dt;
      if(h.lock>=4){h.node=[5,6,7][ri(3)];h.spot=0;h.timer=Math.max(3.5,rnd(7,12)-S.night);sfx(200,.15,'sine',.1);say('...형광등 소리가 다시 들린다')}
    }else{
      h.wait+=dt;
      if(h.wait>=7-S.night*.5)return die('교대자');
    }
  }

  // 응시자 (2일 차~): 같은 카메라를 오래 보면 위험
  if(S.night>=2){
    const g=S.gaze;
    g.timer-=dt;
    if(g.timer<=0&&g.p<20){g.cam=ri(8);g.timer=rnd(12,20)}
    if(monOn()&&S.cam===g.cam){g.p+=dt*(12+S.night*3);S.san-=dt*1.5}
    if(g.p>50&&!g.sq){g.sq=1;squelch(0,.3)}if(g.p<20)g.sq=0; // 눈이 움직이는 질척한 소리
    else g.p=Math.max(0,g.p-dt*10);
    if(g.p>=100)return die('응시자');
  }

  // 그림자 (3일 차~): 조명이 꺼지면 다가옴
  if(S.night>=3){
    const s=S.shadow;
    s.p=lightOn()?Math.max(0,s.p-dt*7):s.p+dt*(3+S.night);
    if(s.p>60&&!s.br){s.br=1;breathe(rnd(-1,1),.3)}if(s.p<30)s.br=0; // 어둠 속 숨소리
    if(s.p>=100)return die('그림자');
  }

  // 복제자 (4일 차~): 신고하지 않으면 정신력 크게 감소
  if(S.night>=4){
    const c=S.clone;
    if(c.cam<0){c.timer-=dt;if(c.timer<=0){c.cam=ri(8);c.t=0;giggle(rnd(-1,1))}}
    else{
      c.t+=dt;
      if(c.t>=25){c.cam=-1;c.timer=rnd(15,25);S.san-=35;say('무언가 잘못된 느낌이 든다');sfx(60,1,'sawtooth',.15)}
    }
  }

  // 정신력
  if(!lightOn())S.san-=dt*1.2;
  else if(S.log)S.san+=dt*4;
  else S.san+=dt*.3;
  S.san=Math.min(100,S.san);
  if(S.san<=0)return die('정신');

  // 정신력이 낮으면 가짜 존재 + 가짜 소리 끊김
  if(S.san<40){
    S.fake.timer-=dt;
    if(S.fake.timer<=0){S.fake.cam=Math.random()<.6?ri(8):-1;S.fake.type=Math.random()<.5?'hum':'clone';S.fake.timer=rnd(3,7)}
  }else S.fake.cam=-1;
  if(S.san<30&&Math.random()<dt*.05)S.silT=2;
  if(S.silT>0)S.silT-=dt;

  setHum(h.node!==DOOR&&!(S.silT>0));
  if(S.msgT>0)S.msgT-=dt;
  if(S.shake>0)S.shake-=dt;
  ambient(dt);heartbeat(dt);phoneTick(dt);doorTick(dt);threeAM();if(S.monMsg){S.monMsg.t+=dt;if(S.monMsg.t>1.6)S.monMsg=null}if(S.clockRev>0)S.clockRev-=dt;
  updHUD();
}

// ===================== 분위기 (점프스케어 말고 공기로 무섭게) =====================
function danger(){const h=S.hum;let d=h.node===DOOR?1:Math.max(0,(2-DIST[h.node])/2)*.7+(DIST[h.node]===0?h.spot*.1:0);if(S.night>=2)d=Math.max(d,S.gaze.p/100);if(S.night>=3)d=Math.max(d,S.shadow.p/100);return Math.max(d,(100-S.san)/160)}
function ambient(dt){
  S.ambT-=dt;if(S.ambT>0)return;
  S.ambT=rnd(9,24)*(.5+S.san/200);
  const r=Math.random(),hd=S.hum.node===DOOR?0:DIST[S.hum.node];
  if(r<.12){const q=Math.random();if(q<.3)wail(rnd(-1,1));else if(q<.55&&hd<=1)groan(rnd(-.6,.6),.12);else if(q<.75)drag(rnd(-1,1),.12);else{for(let k=0;k<rnd(4,9);k++)setTimeout(()=>drip(rnd(-.5,.5)),k*rnd(300,700))}return} // 기괴한 소리
  if(r<.24)footsteps(rnd(-1,1));
  else if(r<.38)creak();
  else if(r<.5)Math.random()<.5?metal():(squelch(rnd(-1,1),.12),setTimeout(()=>crack(rnd(-1,1),.18),400));
  else if(r<.63&&S.hum.node!==DOOR){S.peek={type:'window',t:0};footsteps(-.7,3)}
  else if(r<.73)S.peek={type:'face',t:0};
  else if(r<.8)flicker(rnd(.4,1.3));
  else if(r<.86){const m=['뒤를 봐','교대 시간입니다','그는 문 앞에 있다','나가','왜 아직 여기 있어?','당신도 곧 교대합니다','보고 있어'];S.monMsg={t:0,txt:m[ri(m.length)]};nburst(3000,1,.2,.06,0)}
  else if(r<.9){S.clockRev=rnd(2,4)} // 시계가 거꾸로 돈다
  else if(r<.93&&S.night>=2)musicBoxFar();
  else if(S.san<60)whisper();
  else if(S.hum.node!==DOOR&&DIST[S.hum.node]>=2)knock();
}
function flicker(d){S.flickT=d;buzzClick();if(S.night>=2&&Math.random()<.25)S.sub=1} // 깜빡이는 순간 무언가 비침
// 아무도 없는데 울리는 전화
function phoneTick(dt){
  if(S.night<2||S.over)return;
  if(S.ring>0){if(!S.rUI){S.rUI=1;buildUI()}S.ring-=dt;S.rgB=(S.rgB||0)-dt;if(S.rgB<=0){S.rgB=2.6;ringTone()}if(S.ring<=0){S.rUI=0;say('...전화가 끊겼다');buildUI()}return}
  S.ringT-=dt;if(S.ringT<=0){S.ringT=rnd(70,160);S.ring=11;S.rgB=0}
}
function answerCall(){
  S.ring=0;S.rUI=0;buildUI();const L=['(숨소리만 들린다)','"...거기 누구 있어요?"','"문 열어줘. 나야."','"뒤에 누가 서 있어요."','"너도 곧 교대할 거야."','"여기는 너무 추워."','(수화기 너머로 당신 목소리가 들린다)'];
  say(L[ri(L.length)]);S.san-=6;setTimeout(()=>{if(S&&!S.over){breathe(0,.28);if(Math.random()<.5)giggle(0,.06)}},300);
}
// 교대자가 문 앞에서 손잡이를 흔듦
function doorTick(dt){
  if(S.hum.node!==DOOR)return;S.rattleT-=dt;
  if(S.rattleT<=0){S.rattleT=rnd(1.8,3.2);for(let k=0;k<4;k++){nburst(1800,6,.06,.2,-.7,k*.09);thump(140,.05,.15,-.7,k*.09)}if(S.view===0)S.shake=.2}
}
// 새벽 3시
function threeAM(){
  if(S.h3||S.t<HOUR*3)return;S.h3=true;flicker(2.4);musicBoxFar();setTimeout(()=>{if(S&&!S.over){wail(.8,.05);say('03:00')}},2600);
}
function heartbeat(dt){
  const d=danger();
  S.dgT-=dt;if(S.dgT<=0&&droneG){S.dgT=.5;droneG.gain.setTargetAtTime(.03+S.night*.006+d*.09,AC.currentTime,.6)}
  if(d<.45)return;S.hbT-=dt;if(S.hbT<=0){heart();S.hbT=lerp(1.1,.42,(d-.45)/.55)}
}
// 실제 시간으로 흐르는 연출
const DUST=Array.from({length:50},()=>({x:rnd(.28,.72),y:rnd(.05,.85),v:rnd(.004,.018),p:rnd(0,6)}));
function animate(dt){
  S.camX+=(S.view-S.camX)*Math.min(1,dt*7);
  const tgt=monOn()?1:0;S.monA+=Math.sign(tgt-S.monA)*Math.min(Math.abs(tgt-S.monA),dt*4.5);
  if(S.camSw>0)S.camSw-=dt;
  if(S.lockT>0)S.lockT-=dt;
  if(S.bp){
    if(S.over||S.brk){S.bp=false;$('brkp').classList.remove('show')}
    else if(S.holding&&S.lockT<=0){if(S.sw.every(x=>x)){S.hold+=dt/1.8;if(Math.random()<.15)thump(50,.1,.08,.3);if(S.hold>=1)finishBrk()}else spark()}
    else S.hold=Math.max(0,S.hold-dt*2);
    $('bprog').style.width=Math.min(100,S.hold*100)+'%';
  }
  if(S.flickT>0){S.flickT-=dt;S.flOn=Math.random()>.45;if(!S.flOn&&Math.random()<.1)buzzClick()}else S.flOn=true;
  if(S.peek){S.peek.t+=dt;if(S.peek.t>1.8)S.peek=null}
  DUST.forEach(d=>{d.y+=d.v*dt;d.x+=Math.sin(T_*.5+d.p)*.0004;if(d.y>.88)d.y=.05});
  if(staticG)staticG.gain.setTargetAtTime(monOn()?.018+Math.max(0,S.camSw)*.4:0,AC.currentTime,.05);
}

// ===================== 행동 =====================
function turn(d){
  if(!S||S.over||S.mon||S.log||S.bp)return;
  const v=Math.max(0,Math.min(2,S.view+d));
  if(v!==S.view){S.view=v;whoosh();buildUI()}
}
function toggleMon(){
  if(!powered()){say('전원이 없다');return}
  S.mon=!S.mon;S.camSw=.3;sfx(S.mon?900:400,.06,'square',.06);buildUI();
}
function setCam(i){S.cam=i;S.camSw=.25;sfx(1200,.03,'square',.05);buildUI()}
function toggleDoor(){S.door=!S.door;sfx(120,.2,'square',.15);thump(70,.3,.3,-.3);S.shake=.15;buildUI()}
function toggleLight(){S.light=!S.light;sfx(1500,.03,'square',.08);buildUI()}
function resetBrk(){if(S.brk||S.over)return;S.bp=true;S.holding=false;S.hold=0;$('brkp').classList.add('show');renderBrk();buildUI()} // 배전반 열기
function closeBrk(){S.bp=false;S.holding=false;$('brkp').classList.remove('show');buildUI()}
function finishBrk(){S.brk=true;S.bp=false;S.holding=false;S.hold=0;$('brkp').classList.remove('show');sfx(200,.2,'square',.15);thump(90,.25,.25,.3);say('차단기를 올렸다.');buildUI()}
function toggleSw(i){if(!S.bp||S.lockT>0)return;S.sw[i]=!S.sw[i];sfx(S.sw[i]?1400:900,.03,'square',.08);thump(140,.08,.12,.3);renderBrk()}
function spark(){ // 스위치가 덜 올라간 상태로 레버를 당기면 합선
  S.lockT=1.4;S.holding=false;S.hold=0;S.shake=.3;nburst(5000,1,.35,.35,.3);thump(60,.4,.4,.3);
  if(S.hum.node!==DOOR)S.hum.timer-=3; // 소리 때문에 교대자가 서두름
  say('파직! 합선이다. 내려간 스위치부터 올려');const b=$('brkp');b.classList.add('spark');setTimeout(()=>b.classList.remove('spark'),120);
}
function renderBrk(){const box=$('bsw');box.innerHTML='';S.sw.forEach((on,i)=>{const b=document.createElement('button');b.className='sw '+(on?'on':'off')+(i===S.dead?' dead':'');b.innerHTML=`<span class="n">${i+1}</span><span class="h"></span><span class="l"></span>`;b.onclick=e=>{e.stopPropagation();toggleSw(i)};box.appendChild(b)})}
function report(){
  if(S.ring>0){answerCall();return}
  if(!powered()){say('수화기 너머로 아무 소리도 없다');return}
  sfx(700,.08,'square',.1);
  if(S.night<4){say('뚜... 뚜... 아무도 받지 않는다');return}
  const c=S.clone;
  if(c.cam>=0){c.cam=-1;c.timer=rnd(15,25);S.san=Math.min(100,S.san+10);say('"확인했습니다. 근무를 계속하세요."')}
  else{S.san-=10;say('"...거기엔 아무것도 없습니다."')}
}
function openLog(){
  if(S.view!==1||S.mon)return;
  let t=`근무 일지 – ${S.night}일 차\n\n${BASE_RULES}\n`;
  for(let i=0;i<S.night;i++)t+=`\n${i+1}. ${RULES[i]}`;
  $('logText').textContent=t;
  S.log=true;$('log').classList.add('show');buildUI();
}
function closeLog(){S.log=false;S.paused=false;$('log').classList.remove('show');buildUI()}

// ===================== 지도 =====================
const humAtDoor=()=>S.hum.node===DOOR;
function humMoved(prev){
  const n=S.hum.node;
  if(monOn()&&(S.cam===prev||S.cam===n))S.camSw=.6; // 보고 있던 카메라가 지지직
  const p=n===DOOR?[50,66]:MAPP[n],near=n===DOOR?0:DIST[n];
  footsteps((p[0]-50)/50,3,[.28,.16,.09,.05][near]);
  if(n===DOOR){groan(-.7,.22);setTimeout(()=>breathe(-.85,.25),1600)} // 문 바로 앞
  else if(S.hum.spot===2)drag((p[0]-50)/50,.08+.08*(2-near));
}
function buildMap(){
  const m=$('map');let s='<svg viewBox="0 0 100 75">';
  ADJ.forEach((nb,i)=>nb.forEach(j=>{if(i<j)s+=`<line x1="${MAPP[i][0]}" y1="${MAPP[i][1]}" x2="${MAPP[j][0]}" y2="${MAPP[j][1]}" stroke="rgba(170,210,170,.28)" stroke-width="3.2"/>`}));
  s+=`<line x1="50" y1="${MAPP[0][1]}" x2="50" y2="66" stroke="rgba(170,210,170,.28)" stroke-width="3.2"/>`;
  MAPP.forEach(p=>s+=`<rect x="${p[0]-8}" y="${p[1]-4.5}" width="16" height="9" fill="rgba(25,50,30,.7)" stroke="rgba(170,220,170,.5)" stroke-width=".5"/>`);
  s+='<rect x="42" y="62" width="16" height="9" fill="rgba(80,70,30,.6)" stroke="rgba(220,210,150,.7)" stroke-width=".5"/><text x="50" y="68" font-size="3.8" fill="#e8dca0" text-anchor="middle">관측실</text>';
  s+='<circle id="hd" r="2.2" fill="#f33" style="display:none"/></svg>';
  m.innerHTML=s;
  CAMS.forEach((c,i)=>{const b=document.createElement('button');b.className='cb';b.textContent=c;b.title=CAMN[i];b.style.left=MAPP[i][0]+'%';b.style.top=(MAPP[i][1]/75*100)+'%';b.onclick=e=>{e.stopPropagation();setCam(i)};m.appendChild(b)});
  const lab=document.createElement('div');lab.className='mlab';lab.textContent='MAP';m.appendChild(lab);

  {const mw=Math.min(W*.36,300,H*.56*4/3),m=$('map');m.style.width=mw+'px';m.style.height=mw*.75+'px'} // 지도 크기
  $('dbg').classList.toggle('min',H<520||W<700);
  cv.width=W*DPR;cv.height=H*DPR;cx.setTransform(DPR,0,0,DPR,0,0);
  LC.width=W*DPR;LC.height=H*DPR;
  VIG=makeVig(W,H,.85);
  CW=Math.round(W*.62);CH=Math.round(H*.62);camC.width=CW;camC.height=CH;
  buildViews();buildMenuCam();buildCams();
}
let rzT=0;addEventListener('resize',()=>{clearTimeout(rzT);rzT=setTimeout(resize,150)});
resize();

// ===================== 입력 =====================
$('lb').onclick=()=>turn(-1);
$('rb').onclick=()=>turn(1);
$('logClose').onclick=closeLog;
let tx=null;
const isRot=()=>document.documentElement.classList.contains('rot');
cv.addEventListener('touchstart',e=>{const t=e.touches[0];tx=isRot()?t.clientY:t.clientX},{passive:true});
cv.addEventListener('touchend',e=>{
  if(tx==null)return;const t=e.changedTouches[0],dx=(isRot()?t.clientY:t.clientX)-tx;tx=null; // 돌린 화면에서는 세로 이동이 좌우
  if(Math.abs(dx)>60)turn(dx>0?-1:1);
});
// 조작은 PC·모바일 모두 화면 버튼 클릭으로만 (키보드 단축키 없음)
// 배전반 레버 / 닫기
{const lv=$('blever'),on=e=>{e.preventDefault();if(S)S.holding=true},off=()=>{if(S)S.holding=false};lv.addEventListener('pointerdown',on);['pointerup','pointerleave','pointercancel'].forEach(t=>lv.addEventListener(t,off));lv.addEventListener('contextmenu',e=>e.preventDefault());$('bclose').onclick=closeBrk}
// 브라우저는 첫 터치/클릭 전에는 소리를 못 냄
const unlock=()=>{initAudio();if(staticG&&mode==='menu')staticG.gain.setTargetAtTime(.04,AC.currentTime,.3)};
addEventListener('pointerdown',unlock);addEventListener('keydown',unlock);

// ===================== 메뉴 / 개발자 모드 =====================
function toMenu(){
  if(S){S.over=true;if(humG)humG.gain.setTargetAtTime(0,AC.currentTime,.05)}
  document.body.classList.remove('scare');S=null;['end','devp','log','intro','brkp'].forEach(id=>$(id).classList.remove('show'));
  $('lb').style.display=$('rb').style.display='none';
  $('mCont').style.display=savedNight>1?'block':'none';$('mCont').textContent=`이어하기 (${savedNight}일 차)`;
  setMode('menu');if(staticG)staticG.gain.setTargetAtTime(.04,AC.currentTime,.3);
}
function startGame(n,dev){initAudio();DEV.on=dev;DEV.speed=1;if(staticG)staticG.gain.setTargetAtTime(0,AC.currentTime,.1);newNight(n);buildDbg()}
$('mNew').onclick=()=>startGame(1,false);
$('mCont').onclick=()=>startGame(savedNight,false);
$('mDev').onclick=()=>$('devp').classList.add('show');
$('devBack').onclick=()=>$('devp').classList.remove('show');
$('endMenu').onclick=toMenu;
for(let n=1;n<=NIGHTS;n++){const b=document.createElement('button');b.textContent=n+'일 차';b.onclick=()=>startGame(n,true);$('devNights').appendChild(b)}
[['dNoScare','noScare'],['dInfo','info'],['dGod','god'],['dBright','bright']].forEach(([id,k])=>{$(id).onchange=e=>{DEV[k]=e.target.checked;buildDbg()}});
$('dbgTog').onclick=e=>{e.stopPropagation();const d=$('dbg');d.classList.toggle('min');$('dbgTog').textContent=d.classList.contains('min')?'DEV ▸':'DEV ▾'};
function buildDbg(){
  const box=$('dbgBtns');box.innerHTML='';
  const mb=(t,f,on)=>{const b=document.createElement('button');b.textContent=t;if(on)b.className='on';b.onclick=e=>{e.stopPropagation();f();buildDbg()};box.appendChild(b)};
  [1,2,4,8].forEach(s=>mb(s+'x',()=>DEV.speed=s,DEV.speed===s));
  mb('무적',()=>DEV.god=!DEV.god,DEV.god);
  mb('밝게',()=>DEV.bright=!DEV.bright,DEV.bright);
  mb('6시로',()=>{if(S&&!S.over)S.t=HOUR*6-3});
  mb('메뉴',toMenu);
  $('dbg').style.display=(mode==='game'&&DEV.on&&DEV.info)?'block':'none';
  $('dbgTog').textContent=$('dbg').classList.contains('min')?'DEV ▸':'DEV ▾';
}
function updDbg(){
  const h=S.hum,g=S.gaze,s=S.shadow,c=S.clone,n=S.night;
  $('dbgText').textContent=
`[DEV] ${n}일 차 · ${DEV.speed}x
교대자: ${h.node===DOOR?'문 앞!':'CAM '+CAMS[h.node]+' (위치 '+h.spot+')'} · 이동 ${h.timer.toFixed(1)}s
  대기 ${h.wait.toFixed(1)} / 잠금 ${h.lock.toFixed(1)}
응시자: ${n>=2?'CAM '+CAMS[g.cam]+' · '+(g.p|0)+'%':'-'}
그림자: ${n>=3?(s.p|0)+'%':'-'}
복제자: ${n>=4?(c.cam<0?'없음 ('+c.timer.toFixed(0)+'s)':'CAM '+CAMS[c.cam]+' · '+c.t.toFixed(0)+'s'):'-'}
전력 ${S.power.toFixed(1)} · 정신 ${S.san.toFixed(1)}
가짜: ${S.fake.cam<0?'-':'CAM '+CAMS[S.fake.cam]}`;
}
// 타이틀 글리치
setInterval(()=>{if(mode!=='menu'||Math.random()>.3)return;const t=$('title');t.classList.add('glitch');setTimeout(()=>t.classList.remove('glitch'),80+Math.random()*120)},700);

buildMap();buildJumps();
toMenu();
if(/[?&]test/.test(location.search))$('devp').classList.add('show');

// ===================== 루프 =====================
function loop(ts){
  const dt=Math.min(.05,(ts-last)/1000||0);last=ts;T_=ts/1000;
  if(mode==='menu')renderMenu(dt);
  else if(mode==='game'&&S){
    if(!S.paused)update(dt*(DEV.on?DEV.speed:1));
    if(S)animate(dt);
    if(jump>0){jump-=dt;drawJump()}else if(S)render();
    if(S&&DEV.on&&DEV.info)updDbg();
    if(S&&S.mon)updMapDot();
  }else renderStatic();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
