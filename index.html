<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Awful Space</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=VT323&family=Nanum+Gothic+Coding&family=Nanum+Myeongjo:wght@800&family=Nanum+Pen+Script&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#000;overflow:hidden;font-family:'Nanum Gothic Coding',monospace;color:#d8cfa8;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent}
canvas{position:fixed;inset:0;width:100%;height:100%;touch-action:none}

/* 게임 HUD */
#hud{position:fixed;top:0;left:0;right:0;display:none;justify-content:space-between;align-items:flex-start;padding:14px 18px;pointer-events:none;z-index:2;color:#e6dcb4;text-shadow:0 0 6px #000}
#clock{font-family:VT323,monospace;font-size:40px;line-height:.85;letter-spacing:2px;text-shadow:2px 0 rgba(255,40,30,.35),-2px 0 rgba(40,220,255,.22),0 0 14px rgba(255,230,160,.25)}
#clock small{font-size:20px;margin-left:6px;opacity:.7}
#night{font-size:11px;letter-spacing:.32em;opacity:.55;margin-top:7px}
.meter{width:150px;margin-bottom:10px}
.meter .lab{display:flex;justify-content:space-between;align-items:baseline;font-size:11px;letter-spacing:.25em;opacity:.85;margin-bottom:4px}
.meter b{font-family:VT323,monospace;font-size:18px;letter-spacing:1px;font-weight:normal}
.bar{height:8px;background:rgba(14,12,6,.75);border:1px solid rgba(220,200,140,.28);padding:1px;position:relative}
.bar i{display:block;height:100%;background:linear-gradient(90deg,#7a6a30,#e6d070);box-shadow:0 0 8px rgba(230,200,100,.35);transition:width .4s}
.bar.seg::after{content:'';position:absolute;inset:1px;background:repeating-linear-gradient(90deg,transparent 0 calc(10% - 2px),rgba(10,8,4,.95) calc(10% - 2px) 10%)}
#ekg{position:static;inset:auto;touch-action:auto;display:block;width:150px;height:30px;background:rgba(6,10,8,.65);border:1px solid rgba(160,220,200,.22)}
#clock.glt{color:#ffb0a0;text-shadow:5px 0 rgba(255,40,30,.7),-5px 0 rgba(40,220,255,.5);transform:skewX(-8deg) translateX(3px)}
#hud.unst>div{animation:hudj .18s infinite steps(2)}
@keyframes hudj{0%{transform:translate(0,0)}50%{transform:translate(1.5px,-1px)}100%{transform:translate(-1px,1px)}}
.bar.low i{background:linear-gradient(90deg,#5a140c,#e04428)!important;box-shadow:0 0 10px rgba(240,60,40,.5)!important;animation:bl .7s infinite}
#msg{position:fixed;left:50%;transform:translateX(-50%);bottom:8%;width:max-content;max-width:86%;text-align:center;font-size:16px;letter-spacing:.04em;line-height:1.5;padding:8px 34px;background:linear-gradient(90deg,transparent,rgba(0,0,0,.75) 18%,rgba(0,0,0,.75) 82%,transparent);color:#efe4bf;text-shadow:0 0 6px #000;opacity:0;transition:opacity .8s;pointer-events:none;z-index:2}
body.cam #msg{bottom:72px}
button{font:inherit;font-size:15px;color:#d8cfa8;background:rgba(12,11,6,.75);border:1px solid rgba(120,110,60,.6);padding:10px 14px;min-width:44px;min-height:44px;cursor:pointer}
button.on{background:rgba(120,110,60,.85);color:#111}
body[data-mode=game] #hud{display:flex}
body:not([data-mode=game]) #msg{display:none}
#camOff{position:fixed;left:50%;bottom:12px;transform:translateX(-50%);display:none;align-items:center;gap:10px;z-index:3;font-size:14px;letter-spacing:.12em;color:#cfe8cf;background:linear-gradient(rgba(8,22,10,.5),rgba(3,10,5,.88));border:1px solid rgba(170,220,170,.4);padding:6px 26px;text-shadow:0 0 6px rgba(120,255,140,.45);box-shadow:0 0 18px rgba(80,200,100,.12)}
#camOff:hover{background:rgba(26,58,30,.9)}
#camOff .ar{font-family:VT323,monospace;font-size:18px;animation:bob 1.4s infinite}
@keyframes bob{50%{transform:translateY(3px)}}
#camRep{position:fixed;left:16px;bottom:12px;display:none;align-items:center;gap:10px;z-index:3;font-size:14px;letter-spacing:.14em;color:#ffd8cc;background:linear-gradient(#3a0a06,#1a0302);border:1px solid rgba(230,90,70,.6);padding:6px 18px;box-shadow:0 0 16px rgba(220,40,20,.25),inset 0 1px 0 rgba(255,180,160,.15)}
#camRep .rd{width:10px;height:10px;border-radius:50%;background:#f33;box-shadow:0 0 8px #f33;animation:bl 1.2s infinite}
#camRep:hover{background:linear-gradient(#5a120a,#2a0603)}
#msg.voice{color:#f4dca6;font-style:italic}
#msg.bad{color:#ff9a82;text-shadow:0 0 8px rgba(255,40,20,.55),0 0 2px #000}
.lg-mh{margin-top:16px;font-size:12px;font-weight:bold;letter-spacing:.25em;color:#7a1410;border-top:1px dashed rgba(42,34,20,.4);padding-top:10px}
.lg-m{font-size:13px;line-height:1.7;color:#3a2a18}

/* 오버레이 */
.ov{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;flex-direction:column;align-items:center;justify-content:center;padding:24px;text-align:center;gap:16px;z-index:5}
.ov.show{display:flex}
.ov pre{white-space:pre-wrap;font:inherit;line-height:1.8;max-width:520px;text-align:left;margin:0}
/* 근무 일지: 바인더에 끼운 누런 종이 */
#log{background:radial-gradient(ellipse at center,rgba(20,16,8,.6),rgba(0,0,0,.9))}
#log .sheet{position:relative;width:min(560px,92%);max-height:90%;overflow:auto;padding:40px 34px 22px 60px;color:#2a2214;text-align:left;font-family:'Nanum Gothic Coding',monospace;
  background:var(--paper),radial-gradient(circle at 80% 84%,rgba(110,70,20,0) 0 34px,rgba(110,70,20,.3) 36px,rgba(110,70,20,.08) 40px,rgba(110,70,20,0) 44px),radial-gradient(ellipse at 10% 0%,rgba(90,60,20,.25),transparent 40%),linear-gradient(172deg,#e6dec2,#d2c7a4 55%,#b8ab84);
  background-blend-mode:multiply,normal,normal,normal;box-shadow:0 24px 70px rgba(0,0,0,.85),inset 0 0 70px rgba(90,60,20,.4);transform:rotate(-.8deg)}
#log .sheet::before{content:'';position:absolute;left:16px;top:24px;bottom:24px;width:16px;background:radial-gradient(circle,#0a0907 0 5px,rgba(0,0,0,.25) 6px,transparent 7px) 0 0/16px 56px repeat-y}
#log .sheet::after{content:'';position:absolute;left:46px;top:0;bottom:0;width:1px;background:rgba(170,40,30,.45)}
.lg-h{font-family:'Nanum Myeongjo',serif;font-weight:800;font-size:22px;letter-spacing:.12em;border-bottom:2px solid #2a2214;padding-bottom:6px;padding-right:90px}
.lg-sub{font-size:11px;letter-spacing:.2em;opacity:.6;margin:6px 0 14px}
.lg-base{font-size:14px;line-height:1.85;margin-bottom:10px;white-space:pre-line}
.lg-r{font-family:'Nanum Pen Script',cursive;font-size:25px;line-height:1.2;margin:7px 0;color:#1d2a6a}
.lg-r.new{color:#8a1810}
.lg-r.new::after{content:'  ← 오늘';font-size:19px;opacity:.8}
.lg-r.lie{color:#2a1208;letter-spacing:.06em;transform:rotate(-1.2deg) skewX(-6deg)}
#logClose{position:absolute;top:10px;right:12px;margin:0;min-height:36px;padding:4px 12px;background:rgba(255,250,230,.25);color:#2a2214;border:1px solid rgba(42,34,20,.55);font-size:12px;letter-spacing:.15em}
#logClose:hover{background:rgba(42,34,20,.1)}
/* 끝 화면 */
#end{background:radial-gradient(ellipse at center,rgba(50,0,0,.35),rgba(0,0,0,.94))}
#end h1{font-family:VT323,monospace;font-size:76px;margin:0;letter-spacing:10px;color:#e8dcc0;text-shadow:3px 0 rgba(255,30,30,.6),-3px 0 rgba(30,255,255,.35),0 0 30px rgba(255,60,40,.25);animation:flick 3.2s infinite}
#end pre{text-align:center;opacity:.85;font-size:15px;line-height:1.9;letter-spacing:.04em}
#end button{background:transparent;border:1px solid rgba(220,200,150,.4);letter-spacing:.15em;padding:10px 22px}
#end button:hover{background:rgba(220,200,150,.12)}
#intro{background:#000;font-family:VT323,monospace;pointer-events:none}
#intro .big{font-size:72px;letter-spacing:6px;color:#e8dcc0;text-shadow:3px 0 rgba(255,30,30,.55),-3px 0 rgba(30,240,255,.35)}
#intro.show .big{animation:igl 2.4s steps(1) forwards}
@keyframes igl{0%{transform:translateX(6px) skewX(-10deg);opacity:.4}6%{transform:none;opacity:1}40%{transform:none}41%{transform:translateX(-5px);clip-path:inset(30% 0 40% 0)}43%{transform:none;clip-path:none}100%{transform:none}}
#intro .small{min-height:1.4em}
#intro .small{font-family:'Nanum Gothic Coding',monospace;font-size:18px;opacity:.7}
#intro.show{animation:introFade 2.4s forwards}
@keyframes introFade{0%{opacity:0}15%{opacity:1}75%{opacity:1}100%{opacity:0}}

/* 메인 메뉴 */
#menu{position:fixed;inset:0;z-index:4;display:none;flex-direction:column;justify-content:center;padding:6vh 9vw;gap:4px}
body[data-mode=menu] #menu{display:flex}
#menu h1{font-family:'Nanum Myeongjo',serif;font-weight:800;font-size:clamp(36px,7.2vw,86px);letter-spacing:.12em;color:#ddd5b4;margin:0;text-shadow:0 0 22px rgba(255,240,180,.12);animation:flick 5s infinite}
#menu .sub{font-family:VT323,monospace;font-size:20px;letter-spacing:.5em;opacity:.45;margin:0 0 5vh 4px}
.mbtn{background:none;border:none;text-align:left;font-family:'Nanum Gothic Coding',monospace;font-size:clamp(19px,3vw,26px);color:#cfc8a8;opacity:.55;padding:6px 0;min-height:44px;cursor:pointer;width:max-content}
.mbtn:hover,.mbtn:focus-visible{opacity:1;outline:none}
.mbtn::before{content:'   ';white-space:pre;font-family:VT323,monospace}
.mbtn:hover::before{content:'>> '}
#mHard{color:#e09a8a}#mHard small{font-size:.6em;opacity:.7;margin-left:10px;letter-spacing:.05em}
#menu .foot{position:fixed;left:9vw;right:9vw;bottom:18px;font-size:12px;opacity:.35}
#menu .foot.warn{opacity:.75;color:#d9b36a}
#cap{position:fixed;left:50%;bottom:13%;transform:translateX(-50%);width:max-content;max-width:84%;text-align:center;font-family:'Nanum Myeongjo',serif;font-size:clamp(16px,2.6vw,24px);letter-spacing:.06em;line-height:1.6;color:#efe6cc;text-shadow:0 0 10px #000,0 0 3px #000;opacity:0;transition:opacity 1.1s;pointer-events:none;z-index:4;display:none}
#cap.show{opacity:1}
body[data-mode=cut] #cap{display:block}
#skip{position:fixed;right:18px;bottom:16px;z-index:6;display:none;font-size:13px;letter-spacing:.12em;color:#d8d0b8;background:rgba(0,0,0,.45);border:1px solid rgba(220,210,180,.3);padding:6px 16px;opacity:.75}
body[data-mode=cut] #skip.show{display:block}
body[data-mode=cut] #camOff,body[data-mode=cut] #camRep{display:none!important}
.glitch{text-shadow:4px 0 rgba(255,30,30,.55),-4px 0 rgba(30,255,255,.45)!important;transform:translateX(3px) skewX(-4deg)}
@keyframes flick{0%,100%{opacity:1}41%{opacity:1}42%{opacity:.35}43%{opacity:1}70%{opacity:.9}71%{opacity:.2}72%{opacity:.85}}

/* 개발자 패널 */
#devp{background:rgba(0,0,0,.88);font-size:15px}
#devp h2{font-family:VT323,monospace;font-size:34px;margin:0;letter-spacing:4px}
#devp .row{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
#devp label{display:flex;gap:8px;align-items:center;min-height:36px;cursor:pointer}
#dbg{position:fixed;left:8px;top:64px;z-index:3;font-size:11px;line-height:1.45;background:rgba(0,0,0,.6);padding:6px 8px;border:1px solid rgba(120,110,60,.5);display:none;max-width:260px}
#dbg.min{background:none;border:none;padding:0}
#dbg.min pre,#dbg.min .row{display:none}
#dbgTog{font-size:11px;padding:2px 8px;min-height:28px;min-width:44px;background:rgba(0,0,0,.6)}
#dbg pre{margin:0;font:inherit;white-space:pre-wrap}
#dbg .row{display:flex;gap:4px;flex-wrap:wrap;margin-top:6px}
#dbg button{font-size:11px;padding:4px 7px;min-height:30px;min-width:30px}
/* 세로 화면이면 body를 90도 돌려서 가로 게임 화면으로 (안의 fixed 요소는 body 기준이 됨) */
html.rot body{position:fixed;top:0;left:0;transform-origin:0 0;transform:rotate(90deg) translateY(-100%)}
#map{position:fixed;right:12px;bottom:12px;width:300px;height:225px;z-index:3;display:none;background:rgba(4,10,6,.62);border:1px solid rgba(170,220,170,.35)}
#map svg{position:absolute;inset:0;width:100%;height:100%}
#map .cb{position:absolute;transform:translate(-50%,-50%);font-family:VT323,monospace;font-size:15px;padding:0 6px;min-width:30px;min-height:24px;background:rgba(8,18,10,.9);border:1px solid rgba(170,220,170,.6);color:#cfe8cf}
#map .cb.on{background:#a8dca8;color:#061006}
#map .mlab{position:absolute;left:6px;top:3px;font:12px VT323,monospace;opacity:.6;color:#cfe8cf}
body:not([data-mode=game]) #map{display:none!important}
.scare #hud,.scare #dbg,.scare #map,.scare #camOff,.scare #camRep,.scare #msg{display:none!important}
/* 배전반: 녹슨 철판 */
#brkp{background:rgba(4,4,3,.88)}
#brkp .cab{position:relative;width:min(640px,96%);max-height:96%;overflow:auto;padding:16px 22px 14px;display:flex;flex-direction:column;align-items:center;gap:10px;border:3px solid #1c1d18;
  background:var(--paper),repeating-linear-gradient(90deg,rgba(255,255,255,.025) 0 2px,rgba(0,0,0,.035) 2px 5px),radial-gradient(ellipse at 85% 90%,rgba(110,50,20,.35),transparent 45%),linear-gradient(#62655e,#3c3f39);
  background-blend-mode:multiply,normal,normal,normal;box-shadow:0 20px 60px #000,inset 0 1px 0 rgba(255,255,255,.18),inset 0 0 40px rgba(0,0,0,.5)}
#brkp .cab::before,#brkp .cab::after{content:'';position:absolute;top:8px;width:10px;height:10px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#ddd,#555 60%,#222);box-shadow:0 1px 2px #000}
#brkp .cab::before{left:8px}#brkp .cab::after{right:8px}
.cab-h{width:100%;display:flex;justify-content:space-between;align-items:center;gap:10px}
.cab-h .bpt{font-family:VT323,monospace;font-size:24px;letter-spacing:4px;color:#e2dcc6;text-shadow:0 1px 0 #000}
.cab-h .hv{font-size:12px;font-weight:bold;color:#111;padding:3px 10px;background:repeating-linear-gradient(-45deg,#d8b418 0 10px,#111 10px 20px);text-shadow:none}
.cab-h .hv span{background:#d8b418;padding:0 6px}
#brkp .bhint{font-size:12px;opacity:.75;color:#e8e2cc}
#bsw{display:flex;gap:8px;justify-content:center;padding:14px 14px 10px;background:linear-gradient(#141412,#0a0a09);border:1px solid #000;box-shadow:inset 0 5px 16px rgba(0,0,0,.85)}
#bsw .sw{width:64px;height:134px;padding:8px 0 0;min-width:0;display:flex;flex-direction:column;align-items:center;gap:8px;background:linear-gradient(90deg,#9a9688,#dad6c6 35%,#77736a);border:1px solid #23231e;border-radius:3px;color:#222;-webkit-touch-callout:none;box-shadow:0 4px 8px rgba(0,0,0,.6)}
#bsw .led{width:9px;height:9px;border-radius:50%;background:#1a1a1a;box-shadow:inset 0 1px 2px #000;flex:none}
#bsw .sw.on .led{background:#3e4;box-shadow:0 0 8px #3e4}
#bsw .sw.off .led{background:#f32;box-shadow:0 0 9px #f32;animation:bl .8s infinite}
#bsw .slot{width:22px;height:58px;background:#050505;border-radius:2px;position:relative;box-shadow:inset 0 2px 5px #000;flex:none}
#bsw .h{position:absolute;left:-6px;right:-6px;height:28px;top:2px;background:linear-gradient(90deg,#26261f,#5c5c52 45%,#121210);border-radius:2px;transition:top .08s;box-shadow:0 3px 5px rgba(0,0,0,.7)}
#bsw .sw.on .h{border-bottom:4px solid #2a9a3a}
#bsw .sw.off .h{top:28px;border-top:4px solid #c02418}
#bsw .lab{font-family:'Nanum Pen Script',cursive;font-size:17px;letter-spacing:-.02em;line-height:1.1;color:#1a1a3a;background:#ddd6ba;padding:1px 2px;width:88%;text-align:center;white-space:nowrap;overflow:hidden}
@keyframes bl{50%{opacity:.25}}
.mrow{display:flex;align-items:center;gap:16px;justify-content:center;flex-wrap:wrap}
#blever{display:flex;align-items:center;gap:14px;min-width:230px;min-height:62px;background:linear-gradient(#41100b,#1c0503);border:1px solid #7a2a20;color:#f2dccc;text-align:left;touch-action:none;-webkit-touch-callout:none;box-shadow:inset 0 1px 0 rgba(255,200,180,.18),0 6px 14px rgba(0,0,0,.6)}
#blever .knob{width:24px;height:42px;border-radius:6px;background:linear-gradient(90deg,#5a0e08,#d4321f 45%,#3a0604);box-shadow:0 4px 6px #000;transition:transform .1s;flex:none}
#blever.hold .knob{transform:translateY(7px)}
#blever small{display:block;font-size:11px;opacity:.6;letter-spacing:.1em}
.bbar{width:150px;height:12px;background:#0c0c0a;border:1px solid #2c2c26;padding:2px;box-shadow:inset 0 2px 4px #000}.bbar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#8a6a20,#f0d060);box-shadow:0 0 10px rgba(240,200,90,.5)}
#bclose{font-size:13px;letter-spacing:.12em;background:rgba(0,0,0,.35);border-color:rgba(230,220,190,.3)}
#brkp.spark{background:rgba(255,230,150,.55)}
/* 낮은 화면(가로 폰): 배전반·일지를 납작하게 */
.short #brkp .cab{padding:8px 14px;gap:6px}
.short #brkp .bhint{display:none}
.short #bsw{padding:8px 10px 6px}
.short #bsw .sw{height:98px;width:56px;gap:5px;padding-top:6px}
.short #bsw .lab{font-size:15px}.short #bsw .slot{height:40px}.short #bsw .h{height:19px}.short #bsw .sw.off .h{top:19px}
.short #blever{min-height:48px}.short #blever .knob{height:32px}
.short #log .sheet{padding:22px 22px 14px 52px}
.short .lg-r{font-size:21px;margin:3px 0}.short .lg-base{font-size:13px;line-height:1.6}
.short #clock{font-size:32px}.short .meter{width:120px;margin-bottom:6px}.short #ekg{width:120px;height:24px}
</style>
</head>
<body data-mode="menu">
<canvas id="cv"></canvas>

<div id="hud">
  <div><div id="clock">12:00<small>AM</small></div><div id="night"></div></div>
  <div>
    <div class="meter"><div class="lab"><span>전력</span><b><span id="pw">100</span>%</b></div><div class="bar seg" id="pbar"><i id="pb"></i></div></div>
    <div class="meter"><div class="lab"><span>정신</span><b id="sv">안정</b></div><canvas id="ekg"></canvas></div>
  </div>
</div>
<div id="msg"></div>
<button id="camOff"><span class="ar">▼</span> 모니터에서 눈 떼기</button>
<button id="camRep"><span class="rd"></span>이상 신고</button>
<div id="map"></div>
<div id="dbg"><button id="dbgTog">DEV ▾</button><pre id="dbgText"></pre><div class="row" id="dbgBtns"></div></div>

<div id="menu">
  <h1 id="title">AWFUL SPACE</h1>
  <div class="sub">관측실 근무 기록</div>
  <button class="mbtn" id="mNew">새 근무 시작</button>
  <button class="mbtn" id="mCont">이어하기</button>
  <button class="mbtn" id="mHard">하드 모드</button>
  <button class="mbtn" id="mDev">개발자 모드</button>
  <div class="foot" id="foot">이어폰 권장</div>
</div>

<div class="ov" id="devp">
  <h2>DEVELOPER MODE</h2>
  <div>시작할 일차</div>
  <div class="row" id="devNights"></div>
  <div>
    <label><input type="checkbox" id="dHard"> 하드 모드 (특이사항 + 원래 난이도)</label>
    <label><input type="checkbox" id="dNoScare" checked> 점프스케어 끄기 (사망 시 글자만 표시)</label>
    <label><input type="checkbox" id="dInfo" checked> 디버그 정보 표시</label>
    <label><input type="checkbox" id="dGod"> 무적 (사망 판정 무시)</label>
    <label><input type="checkbox" id="dBright"> 밝게 보기</label>
  </div>
  <button id="devBack">메인 메뉴</button>

  const gr=g.createRadialGradient(c[0],h*.48,0,c[0],h*.48,r);gr.addColorStop(0,'#fff');gr.addColorStop(.3,'#f2ead8');gr.addColorStop(.62,'#9a9282');gr.addColorStop(1,'#3c3832');g.fillStyle=gr;g.fillRect(0,0,w,h);

     anom:[],anomT:rnd(25,40),repCD:0,outT:0,blackT:-1,call:null,storyDone:false,storyRing:false,missed:false,
     hard:HARD,mods:HARD?pickMods(n):[]};
  if(hasMod('black'))S.blackT=HOUR*rnd(1.5,4);if(hasMod('calls'))S.ringT=rnd(40,70);
  buildCams();buildViews();night3D(); // 밤마다 경비실도 조금씩 달라짐
  ['end','start','devp','log','brkp'].forEach(id=>$(id)&&$(id).classList.remove('show'));
  jump=0;document.body.classList.remove('scare');setMode('game');buildUI();updHUD();
  // 밤 시작 연출 → 근무 일지 → 닫으면 시간이 흐름
  {const tx=n+'일 차'+(S.mods.length?'  ·  특이사항: '+S.mods.map(m=>MODS[m][0]).join(', '):''),el=$('introSmall');el.textContent='';let k=0;const iv=setInterval(()=>{k++;el.textContent=tx.slice(0,k);if(k>=tx.length)clearInterval(iv)},40)} // 한 글자씩
  const it=$('intro');it.classList.remove('show');void it.offsetWidth;it.classList.add('show');
  setTimeout(()=>{it.classList.remove('show');if(S&&S.night===n&&!S.over)openLog()},DEV.on?700:2400);
}
function pickMods(n){const k=n<4?1:2,ids=Object.keys(MODS),out=[];while(out.length<k){const m=ids[ri(ids.length)];if(!out.includes(m))out.push(m)}return out}
const powered=()=>S.brk&&S.power>0&&!(S.outT>0);
const lightOn=()=>S.light&&powered();
const doorOn=()=>S.door&&powered();
const monOn=()=>S.mon&&powered();
const lightVis=()=>lightOn()&&S.flOn;

// ===================== 업데이트 (게임 규칙) =====================
function update(dt){
  if(S.over)return;
  S.t+=dt;
  if(S.t>=HOUR*6){win();return}

  // 전력
  if(powered()){
    const d=(.05+(S.light?.14:0)+(S.mon?.1:0)+(S.door?.25:0))*(hasMod('cold')?1.35:1);
    S.power=Math.max(0,S.power-d*dt);
  }
  if(S.power<=0&&!S.outSaid){S.outSaid=true;say('전력이 다 떨어졌다...');sfx(50,1.5,'sawtooth',.2)}
  if(S.mon&&!powered()){S.mon=false;buildUI()}

  // 차단기
  if(S.brk&&S.power>0&&Math.random()<dt*.004*S.night*(S.hard?1:.6)*(hasMod('wire')?2.2:1)){
    S.brk=false;S.sw=Array(6).fill(true);for(let k=0,n=Math.min(5,1+S.night);k<n;){const i=ri(6);if(S.sw[i]){S.sw[i]=false;k++}}say('딸깍. 차단기가 내려갔다.');sfx(90,.3,'square',.2);buildUI();
  }

  // 교대자: 지도를 따라 관측실로 다가옴. 문 앞에 서면 형광등 소리가 끊김
  const h=S.hum;
  if(h.node!==DOOR){
    h.timer-=dt;
    if(h.timer<=0){
      h.timer=Math.max(3.5,rnd(7,12)-S.night)*(hasMod('fast')?.78:1)+(S.hard?0:1.5);
      const prev=h.node;
      if(h.spot<2&&Math.random()<.45)h.spot++;            // 같은 구역에서 카메라 쪽으로 다가옴
      else if(h.node===0){h.node=DOOR;h.wait=0;h.lock=0}  // A에서 문 앞으로
      else{const nb=ADJ[h.node],w=nb.map(n=>DIST[n]<DIST[h.node]?3+S.night*.5:1);let r=Math.random()*w.reduce((a,b)=>a+b,0),k=0;while(k<w.length-1&&r>w[k]){r-=w[k];k++}h.node=nb[k];h.spot=0}
      humMoved(prev);
    }
  }else{
    if(doorOn()){
      h.lock+=dt;
      if(h.lock>=4){h.node=[5,6,7][ri(3)];h.spot=0;h.timer=Math.max(3.5,rnd(7,12)-S.night);sfx(200,.15,'sine',.1);say('...형광등 소리가 다시 들린다')}
    }else{
      h.wait+=dt;
      if(h.wait>=(S.hard?7:8.5)-S.night*.5)return die('교대자');
    }
  }

  // 응시자 (2일 차~): 같은 카메라를 오래 보면 위험
  if(S.night>=2){
    const g=S.gaze;
    g.timer-=dt;
    if(g.timer<=0&&g.p<20){g.cam=ri(8);g.timer=rnd(12,20)}
    if(monOn()&&S.cam===g.cam){g.p+=dt*(S.hard?12+S.night*3:10+S.night*2);S.san-=dt*1.5}
    if(g.p>50&&!g.sq){g.sq=1;squelch(0,.3)}if(g.p<20)g.sq=0; // 눈이 움직이는 질척한 소리
    else g.p=Math.max(0,g.p-dt*10);
    if(g.p>=100)return die('응시자');
  }

  // 그림자 (3일 차~): 조명이 꺼지면 다가옴
  if(S.night>=3){
    const s=S.shadow;
    s.p=lightOn()?Math.max(0,s.p-dt*7):s.p+dt*(S.hard?3+S.night:2.4+S.night*.75);
    if(s.p>60&&!s.br){s.br=1;breathe(rnd(-1,1),.3)}if(s.p<30)s.br=0; // 어둠 속 숨소리
    if(s.p>=100)return die('그림자');
  }

  // 복제자 (4일 차~): 신고하지 않으면 정신력 크게 감소
  if(S.night>=4){
    const c=S.clone;
    if(c.cam<0){c.timer-=dt;if(c.timer<=0){c.cam=ri(8);c.t=0;giggle(rnd(-1,1))}}
    else{
      c.t+=dt;
      if(c.t>=(S.hard?25:35)){c.cam=-1;c.timer=rnd(15,25);S.san-=S.hard?35:25;say('무언가 잘못된 느낌이 든다.','bad');sfx(60,1,'sawtooth',.15)}
    }
  }

  // 이상 현상 (2일 차~): 아무도 안 볼 때 CCTV 어딘가가 바뀜. 신고하지 않으면 정신력이 크게 깎임
  if(S.night>=2){
    S.anomT-=dt;
    if(S.anomT<=0){S.anomT=S.hard?Math.max(14,rnd(28,46)-S.night*3):rnd(40,60);const free=[...Array(8).keys()].filter(i=>!S.anom.some(a=>a.cam===i)&&!(monOn()&&S.cam===i)&&S.clone.cam!==i);
      if(S.anom.length<(S.hard&&S.night>=4?2:1)&&free.length){const types=['chair','door','blood','figure','writing','redlight'];S.anom.push({cam:free[ri(free.length)],type:types[ri(types.length)],t:0,txt:['돌아가','보고 있어','나가','여긴 없어'][ri(4)]});if(Math.random()<.5)creak()}}
    for(let k=S.anom.length-1;k>=0;k--){const a=S.anom[k];a.t+=dt;if(a.t>=(S.hard?42:60)){S.anom.splice(k,1);S.san-=S.hard?18:12;say('무언가 잘못된 느낌이 든다.','bad');sfx(60,1,'sawtooth',.12)}}
  }
  if(S.repCD>0)S.repCD-=dt;
  // 정전 예보
  if(S.blackT>0&&S.t>=S.blackT){S.blackT=-1;S.outT=9;S.mon=false;buildUI();say('정전이다...','bad');sfx(45,1.6,'sawtooth',.2);thump(40,.8,.4,0)}
  if(S.outT>0){S.outT-=dt;if(S.outT<=0){say('전기가 돌아왔다.');buzzClick()}}
  if(hasMod('fog')&&monOn()&&Math.random()<dt*.22)S.camSw=Math.max(S.camSw,.35);
  if(S.call){S.call.t+=dt;if(S.call.t>=3.8){S.call.t=0;S.call.i++;if(S.call.i<S.call.lines.length)say(S.call.lines[S.call.i],'voice',4.2);else{S.call=null;sfx(420,.08,'square',.05)}}}
  // 정신력
  if(!lightOn())S.san-=dt*1.2;
  else if(S.log)S.san+=dt*4;
  else S.san+=dt*.3;
  S.san=Math.min(100,S.san);
  if(S.san<=0)return die('정신');

  // 정신력이 낮으면 가짜 존재 + 가짜 소리 끊김
  if(S.san<40){
    S.fake.timer-=dt;
    if(S.fake.timer<=0){S.fake.cam=Math.random()<.6?ri(8):-1;S.fake.type=Math.random()<.5?'hum':'clone';S.fake.timer=rnd(3,7)}
  }else S.fake.cam=-1;
  if(S.san<30&&Math.random()<dt*.05)S.silT=2;
  if(S.silT>0)S.silT-=dt;

  setHum(h.node!==DOOR&&!(S.silT>0));
  if(S.msgT>0)S.msgT-=dt;
  if(S.shake>0)S.shake-=dt;
  ambient(dt);heartbeat(dt);phoneTick(dt);doorTick(dt);threeAM();if(S.monMsg){S.monMsg.t+=dt;if(S.monMsg.t>1.6)S.monMsg=null}if(S.clockRev>0)S.clockRev-=dt;
  updHUD();
}

// ===================== 분위기 (점프스케어 말고 공기로 무섭게) =====================
function danger(){const h=S.hum;let d=h.node===DOOR?1:Math.max(0,(2-DIST[h.node])/2)*.7+(DIST[h.node]===0?h.spot*.1:0);if(S.night>=2)d=Math.max(d,S.gaze.p/100);if(S.night>=3)d=Math.max(d,S.shadow.p/100);return Math.max(d,(100-S.san)/160)}
function ambient(dt){
  S.ambT-=dt;if(S.ambT>0)return;
  S.ambT=rnd(9,24)*(.5+S.san/200);
  const r=Math.random(),hd=S.hum.node===DOOR?0:DIST[S.hum.node];
  if(r<.12){const q=Math.random();if(q<.3)wail(rnd(-1,1));else if(q<.55&&hd<=1)groan(rnd(-.6,.6),.12);else if(q<.75)drag(rnd(-1,1),.12);else{for(let k=0;k<rnd(4,9);k++)setTimeout(()=>drip(rnd(-.5,.5)),k*rnd(300,700))}return} // 기괴한 소리
  if(r<.24)footsteps(rnd(-1,1));
  else if(r<.38)creak();
  else if(r<.5)Math.random()<.5?metal():(squelch(rnd(-1,1),.12),setTimeout(()=>crack(rnd(-1,1),.18),400));
  else if(r<.63&&S.hum.node!==DOOR){S.peek={type:'window',t:0};footsteps(-.7,3)}
  else if(r<.73)S.peek={type:'face',t:0};
  else if(r<.8)flicker(rnd(.4,1.3));
  else if(r<.86){const m=['뒤를 봐','교대 시간입니다','그는 문 앞에 있다','나가','왜 아직 여기 있어?','당신도 곧 교대합니다','보고 있어'];S.monMsg={t:0,txt:m[ri(m.length)]};nburst(3000,1,.2,.06,0)}
  else if(r<.9){S.clockRev=rnd(2,4)} // 시계가 거꾸로 돈다
  else if(r<.93&&S.night>=2)musicBoxFar();
  else if(S.san<60)whisper();
  else if(S.hum.node!==DOOR&&DIST[S.hum.node]>=2)knock();
}
function flicker(d){S.flickT=d;buzzClick();if(S.night>=2&&Math.random()<.25)S.sub=1} // 깜빡이는 순간 무언가 비침
// 아무도 없는데 울리는 전화
function phoneTick(dt){
  if(S.over||S.call)return;
  if(S.ring>0){if(!S.rUI){S.rUI=1;buildUI()}S.ring-=dt;S.rgB=(S.rgB||0)-dt;if(S.rgB<=0){S.rgB=2.6;ringTone()}
    if(S.ring<=0){S.rUI=0;if(S.storyRing){S.storyRing=false;S.storyDone=true;S.missed=true;say('부재중 전화 1통. 음성 메시지가 남았다.')}else say('...전화가 끊겼다');buildUI()}return}
  if(!S.storyDone){if(S.t>=5){S.ring=14;S.rgB=0;S.storyRing=true;say('책상 위 전화가 울린다.')}return} // 밤 시작 직후 선임 경비의 전화
  if(S.night<2)return;
  S.ringT-=dt;if(S.ringT<=0){S.ringT=hasMod('calls')?rnd(35,70):rnd(70,160);S.ring=11;S.rgB=0;say('책상 위 전화가 울린다.')}
}
function startCall(lines){S.call={lines,i:0,t:0};say(lines[0],'voice',4.2);sfx(420,.05,'square',.05)}
function answerCall(){
  S.ring=0;S.rUI=0;buildUI();
  if(S.storyRing){S.storyRing=false;S.storyDone=true;startCall(CALLS[S.night-1]);return}const L=['(숨소리만 들린다)','"...거기 누구 있어요?"','"문 열어줘. 나야."','"뒤에 누가 서 있어요."','"너도 곧 교대할 거야."','"여기는 너무 추워."','(수화기 너머로 당신 목소리가 들린다)'];
  say(L[ri(L.length)]);S.san-=6;setTimeout(()=>{if(S&&!S.over){breathe(0,.28);if(Math.random()<.5)giggle(0,.06)}},300);
}
// 교대자가 문 앞에서 손잡이를 흔듦
function doorTick(dt){
  if(S.hum.node!==DOOR)return;S.rattleT-=dt;
  if(S.rattleT<=0){S.rattleT=rnd(1.8,3.2);for(let k=0;k<4;k++){nburst(1800,6,.06,.2,-.7,k*.09);thump(140,.05,.15,-.7,k*.09)}if(S.view===0)S.shake=.2}
}
// 새벽 3시
function threeAM(){
  if(S.h3||S.t<HOUR*3)return;S.h3=true;flicker(2.4);musicBoxFar();setTimeout(()=>{if(S&&!S.over){wail(.8,.05);say('03:00')}},2600);
}
function heartbeat(dt){
  const d=danger();
  S.dgT-=dt;if(S.dgT<=0&&droneG){S.dgT=.5;droneG.gain.setTargetAtTime(.03+S.night*.006+d*.09,AC.currentTime,.6)}
  if(d<.45)return;S.hbT-=dt;if(S.hbT<=0){heart();S.hbT=lerp(1.1,.42,(d-.45)/.55)}
}
// 실제 시간으로 흐르는 연출
const DUST=Array.from({length:50},()=>({x:rnd(.28,.72),y:rnd(.05,.85),v:rnd(.004,.018),p:rnd(0,6)}));
function animate(dt){
  S.camX+=(S.view-S.camX)*Math.min(1,dt*7);
  const tgt=monOn()?1:0;S.monA+=Math.sign(tgt-S.monA)*Math.min(Math.abs(tgt-S.monA),dt*4.5);
  if(S.camSw>0)S.camSw-=dt;
  if(S.typ&&S.typ.n<S.typ.t.length){const n0=S.typ.n|0;S.typ.n=Math.min(S.typ.t.length,S.typ.n+dt*34);if((S.typ.n|0)!==n0)$('msg').textContent=S.typ.t.slice(0,S.typ.n|0)}
  if(S.lockT>0)S.lockT-=dt;
  if(S.bp){
    if(S.over||S.brk){S.bp=false;$('brkp').classList.remove('show')}
    else if(S.holding&&S.lockT<=0){if(S.sw.every(x=>x)){S.hold+=dt/1.8;if(Math.random()<.15)thump(50,.1,.08,.3);if(S.hold>=1)finishBrk()}else spark()}
    else S.hold=Math.max(0,S.hold-dt*2);
    $('bprog').style.width=Math.min(100,S.hold*100)+'%';
  }
  if(S.flickT>0){S.flickT-=dt;S.flOn=Math.random()>.45;if(!S.flOn&&Math.random()<.1)buzzClick()}else S.flOn=true;
  if(S.peek){S.peek.t+=dt;if(S.peek.t>1.8)S.peek=null}
  DUST.forEach(d=>{d.y+=d.v*dt;d.x+=Math.sin(T_*.5+d.p)*.0004;if(d.y>.88)d.y=.05});
  if(staticG)staticG.gain.setTargetAtTime(monOn()?.018+Math.max(0,S.camSw)*.4:0,AC.currentTime,.05);
}

// ===================== 행동 =====================
function turn(d){
  if(!S||S.over||S.mon||S.log||S.bp)return;
  const v=Math.max(0,Math.min(2,S.view+d));
  if(v!==S.view){S.view=v;whoosh();buildUI()}
}
function toggleMon(){
  if(!powered()){say('전원이 없다');return}
  S.mon=!S.mon;S.camSw=.3;sfx(S.mon?900:400,.06,'square',.06);buildUI();
}
function setCam(i){S.cam=i;S.camSw=.25;sfx(1200,.03,'square',.05);buildUI()}
function toggleDoor(){S.door=!S.door;sfx(120,.2,'square',.15);thump(70,.3,.3,-.3);S.shake=.15;buildUI()}
function toggleLight(){S.light=!S.light;sfx(1500,.03,'square',.08);buildUI()}
function resetBrk(){if(S.brk||S.over)return;S.bp=true;S.holding=false;S.hold=0;$('brkp').classList.add('show');renderBrk();buildUI()} // 배전반 열기
function closeBrk(){S.bp=false;S.holding=false;$('blever').classList.remove('hold');$('brkp').classList.remove('show');buildUI()}
function finishBrk(){S.brk=true;S.bp=false;S.holding=false;$('blever').classList.remove('hold');S.hold=0;$('brkp').classList.remove('show');sfx(200,.2,'square',.15);thump(90,.25,.25,.3);say('차단기를 올렸다.');buildUI()}
function toggleSw(i){if(!S.bp||S.lockT>0)return;S.sw[i]=!S.sw[i];sfx(S.sw[i]?1400:900,.03,'square',.08);thump(140,.08,.12,.3);renderBrk()}
function spark(){ // 스위치가 덜 올라간 상태로 레버를 당기면 합선
  S.lockT=1.4;S.holding=false;$('blever').classList.remove('hold');S.hold=0;S.shake=.3;nburst(5000,1,.35,.35,.3);thump(60,.4,.4,.3);
  if(S.hum.node!==DOOR)S.hum.timer-=3; // 소리 때문에 교대자가 서두름
  say('파직! 합선이다. 내려간 스위치부터 올려');const b=$('brkp');b.classList.add('spark');setTimeout(()=>b.classList.remove('spark'),120);
}
const BRKN=['조명','CCTV','출입문','통신','환기','비상'];
function renderBrk(){const box=$('bsw');box.innerHTML='';S.sw.forEach((on,i)=>{const b=document.createElement('button');b.className='sw '+(on?'on':'off');b.innerHTML=`<span class="led"></span><span class="slot"><span class="h"></span></span><span class="lab">${BRKN[i]}</span>`;b.onclick=e=>{e.stopPropagation();toggleSw(i)};box.appendChild(b)})}
// 책상 전화기: 울리면 받기, 통화 중이면 끊기, 부재중이면 음성 메시지 듣기
function report(){
  if(S.ring>0){answerCall();return}
  if(S.call){S.call=null;say('딸깍. 전화를 끊었다.');sfx(300,.06,'square',.06);return}
  if(S.missed){S.missed=false;startCall(['(음성 메시지 1건)'].concat(CALLS[S.night-1]));return}
  if(!powered()){say('수화기 너머로 아무 소리도 없다');return}
  sfx(700,.08,'square',.1);
  const r=Math.random();if(S.night>=3&&r<.25){say('뚜... 뚜... (신호음 사이로 숨소리가 섞여 있다)','bad');S.san-=3;setTimeout(()=>{if(S&&!S.over)breathe(.4,.2)},500)}else say('뚜... 뚜... 아무도 받지 않는다');
}
// CCTV 화면에서 이상 신고 (복제자 포함). 없는 걸 신고하면 정신력 감소
function reportCam(){
  if(!S||!S.mon||S.over)return;if(S.repCD>0){say('...처리 중입니다. 잠시 기다리세요.');return}
  S.repCD=2.5;sfx(980,.05,'square',.08);
  const i=S.cam,k=S.anom.findIndex(a=>a.cam===i),cl=S.night>=4&&S.clone.cam===i;
  if(k>=0||cl){if(k>=0)S.anom.splice(k,1);if(cl){S.clone.cam=-1;S.clone.timer=rnd(15,25)}S.san=Math.min(100,S.san+8);S.camSw=.7;setTimeout(()=>{if(S&&!S.over)say('"확인했습니다. 처리하겠습니다."','voice')},500);nburst(2400,2,.4,.06,0)}
  else{S.san-=10;say('"...아무것도 없는데요. 장난치지 마세요."','bad')}
}
function openLog(){

function nburst(freq,q,d,v,pan,when=0,type='bandpass'){if(!AC)return;const t=AC.currentTime+when,s=AC.createBufferSource();s.buffer=NB;const f=AC.createBiquadFilter();f.type=type;f.frequency.value=freq;f.Q.value=q;const g=AC.createGain();g.gain.setValueAtTime(.0001,t);g.gain.linearRampToValueAtTime(v,t+.01);g.gain.exponentialRampToValueAtTime(.001,t+d);s.connect(f);f.connect(g);g.connect(out(pan));s.start(t,Math.random()*1.5);s.stop(t+d+.05)}

function creak(){if(!AC)return;const t=AC.currentTime,o=AC.createOscillator(),f=AC.createBiquadFilter(),g=AC.createGain();o.type='sawtooth';o.frequency.setValueAtTime(rnd(70,110),t);o.frequency.linearRampToValueAtTime(rnd(45,65),t+1.6);f.type='bandpass';f.frequency.value=700;f.Q.value=9;g.gain.setValueAtTime(.0001,t);g.gain.linearRampToValueAtTime(.06,t+.3);g.gain.linearRampToValueAtTime(.0001,t+1.7);o.connect(f);f.connect(g);g.connect(out(rnd(-1,1)));o.start(t);o.stop(t+1.8)}
function metal(){const p=rnd(-1,1);nburst(2400,14,1.6,.07,p);thump(42,1,.18,p)}
function knock(){[0,.32,.64].forEach(w=>{thump(95,.18,.35,-.4,w);nburst(900,2,.08,.18,-.4,w)})}
function whisper(){if(!AC)return;const t=AC.currentTime,s=AC.createBufferSource();s.buffer=NB;const f=AC.createBiquadFilter();f.type='bandpass';f.Q.value=5;f.frequency.setValueAtTime(900,t);f.frequency.linearRampToValueAtTime(2200,t+1.2);f.frequency.linearRampToValueAtTime(1100,t+2.4);const g=AC.createGain();const cv2=new Float32Array(24);for(let i=0;i<24;i++)cv2[i]=Math.random()*.09*Math.sin(i/23*Math.PI);g.gain.setValueCurveAtTime(cv2,t,2.4);s.connect(f);f.connect(g);g.connect(out(rnd(-1,1)));s.start(t);s.stop(t+2.5)}
function heart(){thump(48,.25,.35,0);thump(44,.3,.28,0,.17)}
function buzzClick(){nburst(4200,2,.05,.07,0)}
function whoosh(){nburst(600,.8,.25,.05,0,0,'lowpass')}
function scream(){
  if(!AC)return;
  const len=AC.sampleRate*1.5,b=AC.createBuffer(1,len,AC.sampleRate),d=b.getChannelData(0);
  for(let i=0;i<len;i++)d[i]=(Math.random()*2-1)*(1-i/len);
  const s=AC.createBufferSource();s.buffer=b;const g=AC.createGain();g.gain.value=1;
  s.connect(g);g.connect(master);s.start();
  sfx(70,1.2,'sawtooth',.5);sfx(300,1,'square',.25);
  // 일그러진 비명 + 낮은 충격음
  const t=AC.currentTime,ds=dist(30),f=AC.createBiquadFilter(),sg=AC.createGain();f.type='bandpass';f.frequency.value=1300;f.Q.value=2;sg.gain.setValueAtTime(.55,t);sg.gain.exponentialRampToValueAtTime(.001,t+1.4);ds.connect(f);f.connect(sg);sg.connect(master);
  [0,25,-30,50].forEach(dt2=>{const o=AC.createOscillator(),lfo=AC.createOscillator(),lg2=AC.createGain();o.type='sawtooth';o.detune.value=dt2;o.frequency.setValueAtTime(220,t);o.frequency.linearRampToValueAtTime(620,t+.25);o.frequency.linearRampToValueAtTime(180,t+1.4);lfo.frequency.value=23;lg2.gain.value=40;lfo.connect(lg2);lg2.connect(o.frequency);o.connect(ds);o.start(t);lfo.start(t);o.stop(t+1.45);lfo.stop(t+1.45)});
  thump(38,1.2,.8);crack(0,.5);
}

let LC=mk(10,10),lg=LC.getContext('2d'),VIG=mk(10,10);
function makeVig(w,h,a){const c=mk(w,h),g=c.getContext('2d'),gr=g.createRadialGradient(w/2,h/2,Math.min(w,h)*.25,w/2,h/2,Math.max(w,h)*.72);gr.addColorStop(0,'rgba(0,0,0,0)');gr.addColorStop(1,`rgba(0,0,0,${a})`);g.fillStyle=gr;g.fillRect(0,0,w,h);return c}
function resize(){
  DPR=Math.min(devicePixelRatio||1,2);
  const rot=innerHeight>innerWidth;document.documentElement.classList.toggle('rot',rot);
  W=rot?innerHeight:innerWidth;H=rot?innerWidth:innerHeight; // 게임 화면은 항상 가로
  document.body.style.width=rot?W+'px':'';document.body.style.height=rot?H+'px':'';
  {const mw=Math.min(W*.34,300,H*.5*4/3),m=$('map');m.style.width=mw+'px';m.style.height=mw*.75+'px'} // 지도 크기
  $('dbg').classList.toggle('min',H<520||W<700);document.documentElement.classList.toggle('short',H<480);
  cv.width=W*DPR;cv.height=H*DPR;cx.setTransform(DPR,0,0,DPR,0,0);
  LC.width=W*DPR;LC.height=H*DPR;
  VIG=makeVig(W,H,.85);
  CW=Math.round(W*.62);CH=Math.round(H*.62);camC.width=CW;camC.height=CH;
  if(READY){buildViews();buildMenuCam();if(!R3.ok)buildCams()}
  resize3D();
}

addEventListener('keydown',e=>{if(mode==='cut'&&(e.key==='Escape'||e.key===' '))endCut()});
$('log').addEventListener('click',e=>{if(e.target.id==='log')closeLog()}); // 종이 바깥을 눌러도 덮힘
$('camOff').onclick=e=>{e.stopPropagation();if(S&&S.mon)toggleMon()};
$('camRep').onclick=e=>{e.stopPropagation();reportCam()};
const isRot=()=>document.documentElement.classList.contains('rot');
// 화면 속 물건을 직접 누름. 마우스·터치 공통 (돌린 화면이면 좌표도 돌려서 계산)
const PT={x:-1,y:-1,touch:matchMedia('(hover: none)').matches,on:false,sx:0,sy:0};
function gameXY(e){return isRot()?{x:e.clientY,y:H-e.clientX}:{x:e.clientX,y:e.clientY}}
cv.addEventListener('pointerdown',e=>{PT.touch=e.pointerType!=='mouse';const p=gameXY(e);PT.on=true;PT.sx=PT.x=p.x;PT.sy=PT.y=p.y});
cv.addEventListener('pointermove',e=>{const p=gameXY(e);PT.x=p.x;PT.y=p.y;if(e.pointerType==='mouse')PT.touch=false});
cv.addEventListener('pointerup',e=>{
  if(!PT.on)return;PT.on=false;const p=gameXY(e),dx=p.x-PT.sx,dy=p.y-PT.sy;if(PT.touch)PT.x=PT.y=-1;
  if(Math.abs(dx)>60&&Math.abs(dx)>Math.abs(dy)*1.3){turn(dx>0?-1:1);return} // 밀어서 고개 돌리기
  if(Math.hypot(dx,dy)>16||!canAct())return;
  const nz=navZone(p);if(nz){turn(nz);return}
  const h=hotAt(p);if(h)h.act();
});
cv.addEventListener('pointercancel',()=>{PT.on=false;PT.x=PT.y=-1});
cv.addEventListener('pointerleave',()=>{if(!PT.on)PT.x=PT.y=-1});

{const lv=$('blever'),on=e=>{e.preventDefault();if(S)S.holding=true;lv.classList.add('hold')},off=()=>{if(S)S.holding=false;lv.classList.remove('hold')};lv.addEventListener('pointerdown',on);['pointerup','pointerleave','pointercancel'].forEach(t=>lv.addEventListener(t,off));lv.addEventListener('contextmenu',e=>e.preventDefault());$('bclose').onclick=closeBrk}

// ===================== 메뉴 / 개발자 모드 =====================
function toMenu(){
  if(S){S.over=true;if(humG)humG.gain.setTargetAtTime(0,AC.currentTime,.05)}
  document.body.classList.remove('scare');S=null;['end','devp','log','intro','brkp'].forEach(id=>$(id).classList.remove('show'));
  $('mCont').style.display=savedNight>1?'block':'none';$('mCont').textContent=`이어하기 (${savedNight}일 차)`;
  $('mHard').innerHTML=`하드 모드${savedHard>1?` (${savedHard}일 차)`:''}<small>특이사항이 붙는 밤</small>`;
  setMode('menu');if(staticG)staticG.gain.setTargetAtTime(.04,AC.currentTime,.3);
}
function startGame(n,dev,hard=false){initAudio();DEV.on=dev;HARD=dev?DEV.hard:hard;DEV.speed=1;if(staticG)staticG.gain.setTargetAtTime(0,AC.currentTime,.1);newNight(n);buildDbg()}
// 3D 엔진(700KB)이 아직 오는 중이면 잠깐 기다렸다 시작. 안 그러면 느린 폰 회선에서 2D 방으로 시작됨
let going=false;
function go(fn){
  if(going)return;if(R3.state!=='wait')return fn();
  going=true;const t0=performance.now(),iv=setInterval(()=>{if(R3.state==='wait'&&performance.now()-t0<10000)return;
    clearInterval(iv);going=false;if(R3.state==='wait'){R3.state='fail';R3.why='3D 로딩이 너무 느림';updFoot()}fn()},100); // 늦게라도 오면 게임 중에 3D로 바뀜
}
function updFoot(){const f=$('foot'),st=R3.state;f.textContent=`v${VER} · ${st==='ok'?'3D':st==='wait'?'3D 불러오는 중…':'2D 모드 ('+R3.why+')'} · 이어폰 권장`;f.classList.toggle('warn',st==='fail')}
$('mNew').onclick=()=>go(()=>startGame(1,false));
$('mCont').onclick=()=>go(()=>startGame(savedNight,false));
$('mHard').onclick=()=>go(()=>startGame(savedHard,false,true));
$('mDev').onclick=()=>$('devp').classList.add('show');
$('devBack').onclick=()=>$('devp').classList.remove('show');

[['dHard','hard'],['dNoScare','noScare'],['dInfo','info'],['dGod','god'],['dBright','bright']].forEach(([id,k])=>{$(id).onchange=e=>{DEV[k]=e.target.checked;buildDbg()}});

function buildDbg(){
  const box=$('dbgBtns');box.innerHTML='';
  const mb=(t,f,on)=>{const b=document.createElement('button');b.textContent=t;if(on)b.className='on';b.onclick=e=>{e.stopPropagation();f();buildDbg()};box.appendChild(b)};
  [1,2,4,8].forEach(s=>mb(s+'x',()=>DEV.speed=s,DEV.speed===s));
  mb('무적',()=>DEV.god=!DEV.god,DEV.god);
  mb('밝게',()=>DEV.bright=!DEV.bright,DEV.bright);
  mb('6시로',()=>{if(S&&!S.over)S.t=HOUR*6-3});
  mb('메뉴',toMenu);
  $('dbg').style.display=(mode==='game'&&DEV.on&&DEV.info)?'block':'none';
  $('dbgTog').textContent=$('dbg').classList.contains('min')?'DEV ▸':'DEV ▾';
}
function updDbg(){
  const h=S.hum,g=S.gaze,s=S.shadow,c=S.clone,n=S.night;
  $('dbgText').textContent=
`[DEV] ${n}일 차 · ${DEV.speed}x
교대자: ${h.node===DOOR?'문 앞!':'CAM '+CAMS[h.node]+' (위치 '+h.spot+')'} · 이동 ${h.timer.toFixed(1)}s
  대기 ${h.wait.toFixed(1)} / 잠금 ${h.lock.toFixed(1)}
응시자: ${n>=2?'CAM '+CAMS[g.cam]+' · '+(g.p|0)+'%':'-'}
그림자: ${n>=3?(s.p|0)+'%':'-'}
복제자: ${n>=4?(c.cam<0?'없음 ('+c.timer.toFixed(0)+'s)':'CAM '+CAMS[c.cam]+' · '+c.t.toFixed(0)+'s'):'-'}
전력 ${S.power.toFixed(1)} · 정신 ${S.san.toFixed(1)}
가짜: ${S.fake.cam<0?'-':'CAM '+CAMS[S.fake.cam]}
이상: ${S.anom.map(x=>CAMS[x.cam]+' '+x.type+' '+(x.t|0)+'s').join(', ')||'-'}
특이: ${S.mods.map(m=>MODS[m][0]).join(', ')||'-'}${S.call?' · 통화중':''}${S.missed?' · 부재중':''}`;
}

// 예전 버전이 캐시에 남아 있으면(디스코드 앱 안 브라우저 등) 새 버전으로 한 번 새로고침. 버전은 이 파일의 VER로 비교
function checkVer(){
  if(location.protocol==='file:')return;
  fetch(location.pathname,{cache:'no-cache'}).then(r=>r.ok?r.text():'').then(t=>{
    const v=(t.match(/const VER='([^']+)'/)||[])[1];if(!v||v===VER||mode!=='menu')return;
    const k='awful_ver_'+v;try{if(sessionStorage.getItem(k))return;sessionStorage.setItem(k,'1')}catch(e){return}
    location.replace(location.pathname+'?v='+encodeURIComponent(v)+location.hash);
  }).catch(()=>{});
}
checkVer();addEventListener('pageshow',e=>{if(e.persisted)checkVer()});
try{Promise.all(["40px 'Nanum Pen Script'","20px 'Nanum Gothic Coding'"].map(f=>document.fonts.load(f))).then(()=>{if(READY)buildViews()}).catch(()=>{})}catch(e){} // 손글씨 폰트가 늦게 오면 방을 다시 그림
toMenu();

// ===================== 루프 =====================
function loop(ts){
  const dt=Math.min(.05,(ts-last)/1000||0);last=ts;T_=ts/1000;
  if(mode==='menu')renderMenu(dt);
  else if(mode==='game'&&S){
    if(!S.paused)update(dt*(DEV.on?DEV.speed:1));
    if(S)animate(dt);
    if(jump>0){jump-=dt;drawJump()}else if(S)render();
    if(S&&mode==='game')drawEKG(dt);
    if(S&&DEV.on&&DEV.info)updDbg();
    if(S&&S.mon)updMapDot();
  }else if(mode==='cut'&&CUT.id)renderCut(dt);
  else renderStatic();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
