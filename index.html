<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Awful Space</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=VT323&family=Nanum+Gothic+Coding&family=Nanum+Myeongjo:wght@800&family=Nanum+Pen+Script&family=Nosifer&family=Song+Myung&family=East+Sea+Dokdo&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
:root{--ui:'Song Myung','Nanum Myeongjo',serif;--sub:1}
html,body{margin:0;height:100%;background:#000;overflow:hidden;font-family:var(--ui);color:#d8cfa8;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent}
canvas{position:fixed;inset:0;width:100%;height:100%;touch-action:none}

/* 게임 HUD */
#hud{position:fixed;top:0;left:0;right:0;display:none;justify-content:space-between;align-items:flex-start;padding:14px 18px;pointer-events:none;z-index:2;color:#e6dcb4;text-shadow:0 0 6px #000}
#clock{font-family:VT323,monospace;font-size:40px;line-height:.85;letter-spacing:2px;text-shadow:2px 0 rgba(255,40,30,.35),-2px 0 rgba(40,220,255,.22),0 0 14px rgba(255,230,160,.25)}
#clock small{font-size:20px;margin-left:6px;opacity:.7}
#night{font-family:var(--ui);font-size:12px;letter-spacing:.32em;opacity:.55;margin-top:7px}
.meter{width:150px;margin-bottom:10px}
.meter .lab{display:flex;justify-content:space-between;align-items:baseline;font-family:var(--ui);font-size:12px;letter-spacing:.25em;opacity:.85;margin-bottom:4px}
.meter b{font-family:VT323,monospace;font-size:18px;letter-spacing:1px;font-weight:normal}
.bar{height:8px;background:rgba(14,12,6,.75);border:1px solid rgba(220,200,140,.28);padding:1px;position:relative}
.bar i{display:block;height:100%;background:linear-gradient(90deg,#7a6a30,#e6d070);box-shadow:0 0 8px rgba(230,200,100,.35);transition:width .4s}
.bar.seg::after{content:'';position:absolute;inset:1px;background:repeating-linear-gradient(90deg,transparent 0 calc(10% - 2px),rgba(10,8,4,.95) calc(10% - 2px) 10%)}
#ekg{position:static;inset:auto;touch-action:auto;display:block;width:150px;height:30px;background:rgba(10,8,4,.65);border:1px solid rgba(230,215,170,.22)}
#clock.glt{color:#ffb0a0;text-shadow:5px 0 rgba(255,40,30,.7),-5px 0 rgba(40,220,255,.5);transform:skewX(-8deg) translateX(3px)}
#hud.unst>div{animation:hudj .18s infinite steps(2)}
@keyframes hudj{0%{transform:translate(0,0)}50%{transform:translate(1.5px,-1px)}100%{transform:translate(-1px,1px)}}
.bar.low i{background:linear-gradient(90deg,#5a140c,#e04428)!important;box-shadow:0 0 10px rgba(240,60,40,.5)!important;animation:bl .7s infinite}
#msg{position:fixed;left:50%;transform:translateX(-50%);bottom:8%;width:max-content;max-width:86%;text-align:center;font-size:calc(17px*var(--sub));font-family:var(--ui);letter-spacing:.04em;line-height:1.5;padding:8px 34px;background:linear-gradient(90deg,transparent,rgba(0,0,0,.75) 18%,rgba(0,0,0,.75) 82%,transparent);color:#efe4bf;text-shadow:0 0 6px #000;opacity:0;transition:opacity .8s;pointer-events:none;z-index:2}
body.cam #msg{bottom:72px}
button{font:inherit;font-size:15px;color:#d8cfa8;background:rgba(12,11,6,.75);border:1px solid rgba(120,110,60,.6);padding:10px 14px;min-width:44px;min-height:44px;cursor:pointer}
button.on{background:rgba(120,110,60,.85);color:#111}
body[data-mode=game] #hud{display:flex}
body:not([data-mode=game]) #msg{display:none}
#camOff{position:fixed;left:50%;bottom:12px;transform:translateX(-50%);display:none;align-items:center;gap:10px;z-index:3;font-size:14px;letter-spacing:.12em;color:#efe6cc;background:linear-gradient(rgba(22,18,8,.5),rgba(10,8,3,.88));border:1px solid rgba(230,215,170,.4);padding:6px 26px;text-shadow:0 0 6px rgba(255,220,140,.35);box-shadow:0 0 18px rgba(200,170,80,.12)}
#camOff:hover{background:rgba(58,48,24,.9)}
#camOff .ar{font-family:VT323,monospace;font-size:18px;animation:bob 1.4s infinite}
@keyframes bob{50%{transform:translateY(3px)}}
#camRep{position:fixed;left:16px;bottom:12px;display:none;align-items:center;gap:10px;z-index:3;font-size:14px;letter-spacing:.14em;color:#ffd8cc;background:linear-gradient(#3a0a06,#1a0302);border:1px solid rgba(230,90,70,.6);padding:6px 18px;box-shadow:0 0 16px rgba(220,40,20,.25),inset 0 1px 0 rgba(255,180,160,.15)}
#camRep .rd{width:10px;height:10px;border-radius:50%;background:#f33;box-shadow:0 0 8px #f33;animation:bl 1.2s infinite}
#camRep:hover{background:linear-gradient(#5a120a,#2a0603)}
#msg.voice{color:#f4dca6;font-style:italic}
#msg.bad{color:#ff9a82;text-shadow:0 0 8px rgba(255,40,20,.55),0 0 2px #000}
.lg-mh{margin-top:16px;font-size:12px;font-weight:bold;letter-spacing:.25em;color:#7a1410;border-top:1px dashed rgba(42,34,20,.4);padding-top:10px}
.lg-m{font-family:'Nanum Pen Script',cursive;font-size:22px;line-height:1.2;color:#8a1810}

/* 오버레이 */
.ov{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;flex-direction:column;align-items:center;justify-content:center;padding:24px;text-align:center;gap:16px;z-index:5}
.ov.show{display:flex}
.ov pre{white-space:pre-wrap;font:inherit;line-height:1.8;max-width:520px;text-align:left;margin:0}
/* 근무 일지: 바인더에 끼운 누런 종이 */
#log{background:radial-gradient(ellipse at center,rgba(20,16,8,.6),rgba(0,0,0,.9))}
#log .sheet{position:relative;width:min(560px,92%);max-height:90%;overflow:auto;padding:40px 34px 22px 60px;color:#2a2214;text-align:left;font-family:'Nanum Gothic Coding',monospace;
  background:var(--paper),radial-gradient(circle at 80% 84%,rgba(110,70,20,0) 0 34px,rgba(110,70,20,.3) 36px,rgba(110,70,20,.08) 40px,rgba(110,70,20,0) 44px),radial-gradient(ellipse at 10% 0%,rgba(90,60,20,.25),transparent 40%),linear-gradient(172deg,#e6dec2,#d2c7a4 55%,#b8ab84);
  background-blend-mode:multiply,normal,normal,normal;box-shadow:0 24px 70px rgba(0,0,0,.85),inset 0 0 70px rgba(90,60,20,.4);transform:rotate(-.8deg)}
#log .sheet::before{content:'';position:absolute;left:16px;top:24px;bottom:24px;width:16px;background:radial-gradient(circle,#0a0907 0 5px,rgba(0,0,0,.25) 6px,transparent 7px) 0 0/16px 56px repeat-y}
#log .sheet::after{content:'';position:absolute;left:46px;top:0;bottom:0;width:1px;background:rgba(170,40,30,.45)}
.lg-h{font-family:'Nanum Myeongjo',serif;font-weight:800;font-size:22px;letter-spacing:.12em;border-bottom:2px solid #2a2214;padding-bottom:6px;padding-right:90px}
.lg-sub{font-size:11px;letter-spacing:.2em;opacity:.6;margin:6px 0 14px}
.lg-base{font-family:'Nanum Pen Script',cursive;font-size:23px;line-height:1.3;margin-bottom:10px;white-space:pre-line;color:#2a2a2e}
.lg-r{font-family:'Nanum Pen Script',cursive;font-size:25px;line-height:1.2;margin:7px 0;color:#1d2a6a}
.lg-r.new{color:#8a1810}
.lg-r.lie{color:#b0140c;letter-spacing:.06em;transform:rotate(-2.4deg) skewX(-9deg);font-size:28px;text-shadow:0 0 1px rgba(120,0,0,.5)}
.lg-sig{font-family:'Nanum Pen Script',cursive;font-size:22px;color:#1d2a6a;text-align:right;margin:-4px 8px 4px 0}
#logClose{position:absolute;top:10px;right:12px;margin:0;min-height:36px;padding:4px 12px;background:rgba(255,250,230,.25);color:#2a2214;border:1px solid rgba(42,34,20,.55);font-size:12px;letter-spacing:.15em}
#logClose:hover{background:rgba(42,34,20,.1)}
/* 끝 화면 */
#end{background:radial-gradient(ellipse at center,rgba(50,0,0,.35),rgba(0,0,0,.94))}
#end h1{font-family:'East Sea Dokdo',var(--ui);font-weight:normal;font-size:clamp(84px,14vw,150px);line-height:.9;margin:0;letter-spacing:.04em;color:#9e140c;text-shadow:0 3px 0 #3a0402,0 0 34px rgba(200,20,10,.45),3px 0 rgba(255,40,30,.35);animation:flick 3.2s infinite;transform:rotate(-3deg)}
#end pre{font-family:var(--ui);text-align:center;opacity:.85;font-size:17px;line-height:1.9;letter-spacing:.04em}
#end button{background:transparent;border:1px solid rgba(220,200,150,.4);letter-spacing:.15em;padding:10px 22px}
#end button:hover{background:rgba(220,200,150,.12)}
#intro{background:#000;font-family:VT323,monospace;pointer-events:none}
#intro .big{font-size:72px;letter-spacing:6px;color:#e8dcc0;text-shadow:3px 0 rgba(255,30,30,.55),-3px 0 rgba(30,240,255,.35)}
#intro.show .big{animation:igl 2.4s steps(1) forwards}
@keyframes igl{0%{transform:translateX(6px) skewX(-10deg);opacity:.4}6%{transform:none;opacity:1}40%{transform:none}41%{transform:translateX(-5px);clip-path:inset(30% 0 40% 0)}43%{transform:none;clip-path:none}100%{transform:none}}
#intro .small{min-height:1.4em}
#intro .small{font-family:var(--ui);font-size:22px;letter-spacing:.3em;opacity:.75}
#intro.show{animation:introFade 2.4s forwards}
@keyframes introFade{0%{opacity:0}15%{opacity:1}75%{opacity:1}100%{opacity:0}}

/* 메인 메뉴 */
#menu{position:fixed;inset:0;z-index:4;display:none;flex-direction:column;justify-content:center;padding:6vh 9vw;gap:4px}
body[data-mode=menu] #menu{display:flex}
#menu h1{font-family:'Nosifer',var(--ui);font-weight:normal;font-size:clamp(28px,5.6vw,70px);letter-spacing:.05em;line-height:1.25;color:#d9cfae;margin:0;text-shadow:0 0 1px #000,0 2px 0 #2a0402,0 0 28px rgba(160,20,10,.35),2px 0 rgba(255,40,30,.25),-2px 0 rgba(40,220,255,.12);animation:flick 5s infinite}
#menu .sub{font-family:var(--ui);font-size:clamp(13px,1.6vw,17px);letter-spacing:.42em;color:#b9ad8a;opacity:.6;margin:6px 0 4.5vh 4px}
#menu .sub b{color:#d0382a;font-weight:normal;text-shadow:0 0 8px rgba(220,40,20,.6)}
.mbtn{position:relative;background:none;border:none;text-align:left;font-family:var(--ui);font-size:clamp(20px,2.9vw,28px);letter-spacing:.14em;color:#cfc6a6;opacity:.6;padding:6px 0 6px 26px;min-height:44px;cursor:pointer;width:max-content;transition:opacity .15s,color .15s,letter-spacing .25s}
.mbtn:hover,.mbtn:focus-visible{opacity:1;outline:none;color:#f4e8cc;letter-spacing:.2em;text-shadow:0 0 14px rgba(200,30,20,.55),2px 0 rgba(255,40,30,.3)}
.mbtn::before{content:'';position:absolute;left:4px;top:50%;width:8px;height:8px;margin-top:-4px;background:#7a1610;transform:rotate(45deg) scale(.4);opacity:0;transition:.15s}
.mbtn:hover::before,.mbtn:focus-visible::before{opacity:1;transform:rotate(45deg) scale(1);background:#c8231a;box-shadow:0 0 10px #f22}
.mbtn::after{content:'';position:absolute;left:26px;right:0;bottom:6px;height:1px;background:linear-gradient(90deg,rgba(200,40,30,.8),transparent);transform:scaleX(0);transform-origin:left;transition:transform .25s}
.mbtn:hover::after{transform:scaleX(1)}
#mHard{color:#e09a8a}
#menu .foot{position:fixed;left:9vw;right:9vw;bottom:18px;font-size:12px;opacity:.35}
#menu .foot.warn{opacity:.75;color:#d9b36a}
#cap{position:fixed;left:50%;bottom:13%;transform:translateX(-50%);width:max-content;max-width:84%;text-align:center;font-family:var(--ui);font-size:calc(clamp(16px,2.6vw,24px)*var(--sub));letter-spacing:.06em;line-height:1.6;color:#efe6cc;text-shadow:0 0 10px #000,0 0 3px #000;opacity:0;transition:opacity 1.1s;pointer-events:none;z-index:4;display:none}
#cap.show{opacity:1}
body[data-mode=cut] #cap{display:block}
#skip{position:fixed;right:18px;bottom:16px;z-index:6;display:none;font-size:13px;letter-spacing:.12em;color:#d8d0b8;background:rgba(0,0,0,.45);border:1px solid rgba(220,210,180,.3);padding:6px 16px;opacity:.75}
body[data-mode=cut] #skip.show{display:block}
body[data-mode=cut] #camOff,body[data-mode=cut] #camRep{display:none!important}
.glitch{text-shadow:4px 0 rgba(255,30,30,.55),-4px 0 rgba(30,255,255,.45)!important;transform:translateX(3px) skewX(-4deg)}
@keyframes flick{0%,100%{opacity:1}41%{opacity:1}42%{opacity:.35}43%{opacity:1}70%{opacity:.9}71%{opacity:.2}72%{opacity:.85}}

/* 개발자 패널 */
#devp{background:rgba(0,0,0,.88);font-size:15px}
#devp h2{font-family:VT323,monospace;font-size:34px;margin:0;letter-spacing:4px}
#devp .row{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
#devp label{display:flex;gap:8px;align-items:center;min-height:36px;cursor:pointer}
#dbg{position:fixed;left:8px;top:64px;z-index:3;font-size:11px;line-height:1.45;background:rgba(0,0,0,.6);padding:6px 8px;border:1px solid rgba(120,110,60,.5);display:none;max-width:260px}
#dbg.min{background:none;border:none;padding:0}
#dbg.min pre,#dbg.min .row{display:none}
#dbgTog{font-size:11px;padding:2px 8px;min-height:28px;min-width:44px;background:rgba(0,0,0,.6)}
#dbg pre{margin:0;font:inherit;white-space:pre-wrap}
#dbg .row{display:flex;gap:4px;flex-wrap:wrap;margin-top:6px}
#dbg button{font-size:11px;padding:4px 7px;min-height:30px;min-width:30px}
/* 세로 화면이면 body를 90도 돌려서 가로 게임 화면으로 (안의 fixed 요소는 body 기준이 됨) */
html.rot body{position:fixed;top:0;left:0;transform-origin:0 0;transform:rotate(90deg) translateY(-100%)}
#map{position:fixed;right:12px;bottom:12px;width:300px;height:225px;z-index:3;display:none;background:rgba(10,8,3,.62);border:1px solid rgba(230,215,170,.35)}
#map svg{position:absolute;inset:0;width:100%;height:100%}
#map .cb{position:absolute;transform:translate(-50%,-50%);font-family:VT323,monospace;font-size:15px;padding:0 6px;min-width:30px;min-height:24px;background:rgba(20,16,8,.9);border:1px solid rgba(230,215,170,.6);color:#efe6cc}
#map .cb.on{background:#e8d8a8;color:#1a1408}
#map .cb.ex{box-shadow:0 0 0 1px #3f6,0 0 10px rgba(60,255,110,.6)}#map .cb.ex::after{content:'';position:absolute;right:-4px;top:-4px;width:7px;height:7px;border-radius:50%;background:#4f7;box-shadow:0 0 6px #4f7}
#map .mlab{position:absolute;left:6px;top:3px;font:12px VT323,monospace;opacity:.6;color:#efe6cc}
body:not([data-mode=game]) #map{display:none!important}
.scare #hud,.scare #dbg,.scare #map,.scare #pauseBtn,.scare #camOff,.scare #camRep,.scare #msg{display:none!important}
/* 일시정지 버튼 + 일시정지·설정 창 */
#pauseBtn{position:fixed;top:10px;left:50%;transform:translateX(-50%);z-index:4;display:none;gap:5px;align-items:center;justify-content:center;width:46px;height:40px;min-height:0;padding:0;background:rgba(8,6,3,.45);border:1px solid rgba(230,215,170,.22);opacity:.6}
#pauseBtn i{display:block;width:5px;height:15px;background:#e6dcb4;box-shadow:0 0 6px rgba(255,220,150,.4)}
#pauseBtn:hover{opacity:1;border-color:rgba(200,50,40,.7)}
body[data-mode=game] #pauseBtn{display:flex}
#pause,#settings{background:radial-gradient(ellipse at center,rgba(30,4,2,.55),rgba(0,0,0,.93));z-index:7}
#settings{z-index:8}
.pnl{position:relative;width:min(380px,92%);max-height:94%;overflow:auto;padding:26px 26px 20px;text-align:left;background:linear-gradient(rgba(16,13,8,.96),rgba(8,6,3,.97));border:1px solid rgba(200,180,130,.18);box-shadow:0 30px 80px #000,inset 0 0 60px rgba(0,0,0,.8)}
.pnl.wide{width:min(560px,94%)}
.pnl.wide.two{width:min(900px,95%)}
#setRows.two{display:grid;grid-template-columns:1fr 1fr;column-gap:28px}
.short .pnl{padding:12px 18px 12px}.short .ph{font-size:24px}.short .psub{font-size:15px;margin-bottom:6px}.short .pb{padding:8px 6px 8px 22px;font-size:17px}
.short .srow{padding:4px 2px;font-size:14px}.short .srow .sl small{display:none}.short .seg button{min-height:30px;padding:2px 9px}.short .srow2{margin-top:8px}
.pnl::before{content:'';position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(0deg,rgba(255,255,255,.018) 0 1px,transparent 1px 3px)}
.ph{font-family:var(--ui);font-size:34px;letter-spacing:.3em;color:#e8dcc0;text-shadow:3px 0 rgba(255,30,30,.35),-2px 0 rgba(30,240,255,.18),0 0 18px rgba(200,40,20,.3);animation:flick 4s infinite;margin-bottom:2px}
.psub{font-family:VT323,monospace;font-size:18px;letter-spacing:.2em;color:#9c8f6a;margin-bottom:16px}
.pb{display:block;width:100%;text-align:left;font-family:var(--ui);font-size:20px;letter-spacing:.16em;color:#cfc6a6;background:transparent;border:none;border-bottom:1px solid rgba(200,180,130,.12);padding:12px 6px 12px 22px;position:relative;transition:color .15s,padding .2s}
.pb::before{content:'';position:absolute;left:4px;top:50%;width:6px;height:6px;margin-top:-3px;background:#7a1610;transform:rotate(45deg);opacity:.4}
.pb:hover,.pb:focus-visible{outline:none;color:#fff0dc;padding-left:28px;background:linear-gradient(90deg,rgba(150,20,12,.28),transparent);text-shadow:0 0 10px rgba(255,60,40,.5)}
.pb:hover::before{opacity:1;background:#e02a1e;box-shadow:0 0 8px #f33}
.pb.red{color:#d88a7c}
.pb.warn{color:#ff7a62;animation:bl .9s infinite}
.srow{display:flex;align-items:center;gap:12px;padding:9px 2px;border-bottom:1px solid rgba(200,180,130,.1);font-size:16px;letter-spacing:.06em}
.srow .sl{flex:1;color:#d8cfae}.srow .sl small{display:block;font-size:11px;letter-spacing:.04em;opacity:.5;margin-top:2px;font-family:'Nanum Gothic Coding',monospace}
.srow .sv{font-family:VT323,monospace;font-size:20px;width:46px;text-align:right;color:#e6c890}
.srow input[type=range]{-webkit-appearance:none;appearance:none;width:min(180px,36vw);height:4px;background:linear-gradient(90deg,#8a1a10 var(--p,50%),rgba(220,200,150,.18) var(--p,50%));border-radius:2px;outline:none}
.srow input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:18px;height:18px;border-radius:50%;background:#d8cfae;border:3px solid #6a0e08;box-shadow:0 0 8px rgba(255,60,40,.6);cursor:pointer}
.srow input[type=range]::-moz-range-thumb{width:14px;height:14px;border-radius:50%;background:#d8cfae;border:3px solid #6a0e08}
.seg{display:flex;border:1px solid rgba(200,180,130,.25)}
.seg button{min-height:34px;min-width:0;padding:4px 11px;font-size:14px;letter-spacing:.06em;background:transparent;border:none;border-left:1px solid rgba(200,180,130,.15);color:#a89c7a;font-family:var(--ui)}
.seg button:first-child{border-left:none}
.seg button.on{background:rgba(140,24,14,.75);color:#fff0dc;text-shadow:0 0 6px rgba(255,80,60,.6)}
.srow2{display:flex;gap:10px;margin-top:16px}.srow2 .pb{flex:1;text-align:center;border:1px solid rgba(200,180,130,.2);padding:10px}.srow2 .pb::before{display:none}
/* 업적 */
#achBox{position:fixed;inset:0;z-index:7;background:radial-gradient(ellipse at center,rgba(20,14,6,.7),rgba(0,0,0,.95))}
#achBox .pnl{width:min(980px,96%)}
.agrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px;margin-top:6px}
.acard{position:relative;background:#e4dcc8;padding:7px 7px 30px;box-shadow:0 6px 18px rgba(0,0,0,.7);transform:rotate(var(--r));transition:transform .15s}
.acard:hover{transform:rotate(0) scale(1.04);z-index:2}
.short .agrid{grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:10px}.short .acard .at{font-size:16px}.short .acard{padding:5px 5px 24px}.short .acard .ad{inset:5px 5px 24px;font-size:11px}
.acard img{display:block;width:100%;aspect-ratio:1;object-fit:cover;background:#111}
.acard .at{position:absolute;left:8px;right:8px;bottom:6px;font-family:'Nanum Pen Script',cursive;font-size:20px;line-height:1;color:#1a1a2a;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.acard.lock{background:#4a463c}.acard.lock .at{color:#9a9480}
.acard .ad{position:absolute;inset:7px 7px 30px;display:flex;align-items:flex-end;padding:8px;font-size:12px;line-height:1.35;color:#efe6cc;background:linear-gradient(transparent 35%,rgba(0,0,0,.85));opacity:0;transition:opacity .15s;text-align:left}
.acard:hover .ad,.acard:focus .ad{opacity:1}
.acard .ts{position:absolute;top:-6px;left:50%;width:46px;height:14px;margin-left:-23px;background:rgba(220,210,170,.75);transform:rotate(-3deg)}

<script>
// ===================== 기본 =====================
const VER='0.11.2'; // 올릴 때마다 바꾸기 (캐시에 남은 옛 버전을 새로고침하는 데 씀)
const $=id=>document.getElementById(id);
const cv=$('cv'),cx=cv.getContext('2d');
let W,H,DPR=1;
const rnd=(a,b)=>a+Math.random()*(b-a);
const ri=n=>Math.floor(Math.random()*n);
const lerp=(a,b,t)=>a+(b-a)*t;
const ease=t=>t<.5?2*t*t:1-Math.pow(-2*t+2,2)/2;
function mulberry(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function mk(w,h){const c=document.createElement('canvas');c.width=Math.max(1,Math.round(w));c.height=Math.max(1,Math.round(h));return c}
function polyG(g,p){g.beginPath();g.moveTo(p[0][0],p[0][1]);for(let i=1;i<p.length;i++)g.lineTo(p[i][0],p[i][1]);g.closePath();g.fill()}
function rr(g,x,y,w,h,r){g.beginPath();g.moveTo(x+r,y);g.arcTo(x+w,y,x+w,y+h,r);g.arcTo(x+w,y+h,x,y+h,r);g.arcTo(x,y+h,x,y,r);g.arcTo(x,y,x+w,y,r);g.closePath()}
function centroid(q){return[q.reduce((a,p)=>a+p[0],0)/q.length,q.reduce((a,p)=>a+p[1],0)/q.length]}
function shrink(q,k){const c=centroid(q);return q.map(p=>[c[0]+(p[0]-c[0])*k,c[1]+(p[1]-c[1])*k])}

const HOUR=60;          // 게임 1시간 = 실제 60초
const NIGHTS=5;
const CAMS=['A','B','C','D','E','F','G','H']; // A가 경비실 바로 앞
const CAMN=['경비실 앞','꺾인 복도','젖은 카펫 방','기둥 방','짐 쌓인 방','뜯긴 천장','끝없는 복도','불 꺼진 곳'];
const KIND=['corr','bend','wet','pillar','office','machine','endless','void'];
const ADJ=[[1,2],[0,3,4],[0,3,5],[1,2,6],[1,6],[2,7],[3,4,7],[5,6]]; // 구역 연결
const DIST=[0,1,1,2,2,2,3,3];   // 경비실까지 거리
const MAPP=[[50,52],[30,42],[70,42],[50,30],[13,26],[87,27],[30,12],[70,10]]; // 지도 위치
const DOOR=-1;

let S=null,last=0,jump=0,jumpType='',T_=0,menuT=0,mode='menu';
let savedNight=1,savedHard=1,HARD=false; // 일반 / 하드 모드 진행 저장
try{savedNight=+localStorage.getItem('obs_night')||1;savedHard=+localStorage.getItem('obs_night_hard')||1}catch(e){}
const DEV={on:false,noScare:true,info:true,god:false,bright:false,speed:1,hard:false};

// ===================== 텍스처 =====================
// img/tex 의 jpg 는 tools/textures.html 로 미리 만든 것 (얼룩·곰팡이·요철 음영 포함)
const TX=512; // 벽지 한 폭이 벽 높이의 절반 크기가 되도록 맞추는 기준
const T={};
const texReady=Promise.all([['wall','wall'],['floorW','carpet'],['ceilW','ceil'],['wood','wood'],['metal','metal'],['metalG','metal2'],['conc','concrete']].map(([k,f])=>new Promise(res=>{
  const im=new Image();im.onload=()=>{T[k]=im;res()};im.onerror=()=>{const c=mk(64,64),g=c.getContext('2d');g.fillStyle='#6e6440';g.fillRect(0,0,64,64);T[k]=c;res()};im.src='img/tex/'+f+'.jpg'}))).then(()=>{T.wallT=T.wall});

function texRect(g,tex,x,y,w,h,s=1){g.save();g.beginPath();g.rect(x,y,w,h);g.clip();g.translate(x,y);g.scale(s,s);g.fillStyle=g.createPattern(tex,'repeat');g.fillRect(0,0,w/s+2,h/s+2);g.restore()}
function texPoly(g,tex,p,s=1){g.save();g.beginPath();g.moveTo(p[0][0],p[0][1]);p.slice(1).forEach(q=>g.lineTo(q[0],q[1]));g.closePath();g.clip();g.scale(s,s);g.fillStyle=g.createPattern(tex,'repeat');g.fillRect(-20,-20,4000/s,3000/s);g.restore()}

// 노이즈 패턴 (지지직)
const NOISE=[0,1,2,3].map(k=>{const c=mk(128,128),g=c.getContext('2d'),d=g.createImageData(128,128);for(let i=0;i<d.data.length;i+=4){const v=Math.random()*255;d.data[i]=d.data[i+1]=d.data[i+2]=v;d.data[i+3]=255}g.putImageData(d,0,0);return c});
const NPm=NOISE.map(c=>cx.createPattern(c,'repeat'));
{const c=mk(160,160),g=c.getContext('2d'),d=g.createImageData(160,160);for(let i=0;i<d.data.length;i+=4){const v=205+Math.random()*50;d.data[i]=d.data[i+1]=d.data[i+2]=v;d.data[i+3]=255}g.putImageData(d,0,0);document.documentElement.style.setProperty('--paper',`url(${c.toDataURL()})`)} // 종이·철판 오버레이용 잔결
const camC=mk(10,10),cg=camC.getContext('2d');
const NPc=NOISE.map(c=>cg.createPattern(c,'repeat'));

// ===================== 원근 방 그리기 =====================
const pu=(s,Z)=>(s/Z)/((1-s)+s/Z);       // 화면 위치 → 실제 깊이
const sOf=(u,Z)=>u*Z/(1+u*(Z-1));        // 실제 깊이 → 화면 위치
function geom(w,h,o){o=o||{};return{w,h,nx:-w*.1,ny:-h*.12,nw:w*1.2,nh:h*1.3,bx:w*(o.bx??.22),by:h*(o.by??.15),bw:w*(o.bw??.56),bh:h*(o.bh??.55)}}
function floorAt(G,u,fx){const s=sOf(u,G.nh/G.bh),xl=lerp(G.nx,G.bx,s),xr=lerp(G.nx+G.nw,G.bx+G.bw,s);return{x:lerp(xl,xr,fx),y:lerp(G.ny+G.nh,G.by+G.bh,s),hh:lerp(G.nh,G.bh,s)}}
function wallAt(G,u,side){const s=sOf(u,G.nw/G.bw),x0=side?G.nx+G.nw:G.nx,x1=side?G.bx+G.bw:G.bx;return{x:lerp(x0,x1,s),top:lerp(G.ny,G.by,s),bot:lerp(G.ny+G.nh,G.by+G.bh,s)}}
function fixtureQuad(G,u1,u2,f1=.38,f2=.62){const Z=G.nh/G.bh;const row=u=>{const s=sOf(u,Z);return{y:lerp(G.ny,G.by,s),xl:lerp(G.nx,G.bx,s),xr:lerp(G.nx+G.nw,G.bx+G.bw,s)}};const a=row(u1),b=row(u2);return[[lerp(a.xl,a.xr,f1),a.y],[lerp(a.xl,a.xr,f2),a.y],[lerp(b.xl,b.xr,f2),b.y],[lerp(b.xl,b.xr,f1),b.y]]}
function drawBox(g,G,L,off=0,fl=T.floorW){
  const {w,h,nx,ny,nw,nh,bx,by,bw,bh}=G,Zx=nw/bw,Zy=nh/bh,st=2;
  // 천장
  for(let y=Math.max(0,ny);y<by;y+=st){const s=(y-ny)/(by-ny),u=pu(s,Zy),xl=lerp(nx,bx,s),xr=lerp(nx+nw,bx+bw,s);g.drawImage(T.ceilW,0,((u*L*TX)%T.ceilW.height)|0,T.ceilW.width,1,xl,y,xr-xl,st+.8)}
  // 바닥
  const fb=by+bh,fn=ny+nh;
  for(let y=fb;y<Math.min(h,fn);y+=st){const s=(fn-y)/(fn-fb),u=pu(s,Zy),xl=lerp(nx,bx,s),xr=lerp(nx+nw,bx+bw,s);g.drawImage(fl,0,((u*L*TX+off)%fl.height)|0,fl.width,1,xl,y,xr-xl,st+.8)}
  // 양쪽 벽
  const TW=T.wallT.width,TH=T.wallT.height;
  for(const side of[0,1]){const x0=side?nx+nw:nx,x1=side?bx+bw:bx,a=Math.min(x0,x1),b=Math.max(x0,x1),so=off+side*TW*.37;
    for(let x=Math.max(0,a);x<Math.min(w,b);x+=st){const s=(x-x0)/(x1-x0),u=pu(s,Zx),top=lerp(ny,by,s),bot=lerp(ny+nh,by+bh,s);g.drawImage(T.wallT,((u*L*TX+so)%TW)|0,0,1,TH,x,top,st+.8,bot-top)}}
  // 정면 벽
  {const k=TH/bh;let x=bx,sx=(off*1.7)%TW;while(x<bx+bw-.01){const ww=Math.min(bx+bw-x,(TW-sx)/k);g.drawImage(T.wallT,sx,0,ww*k,TH,x,by,ww,bh);x+=ww;sx=(sx+ww*k)%TW}}
  // 그늘
  const sh=(p,x0,y0,x1,y1,a0,a1)=>{const gr=g.createLinearGradient(x0,y0,x1,y1);gr.addColorStop(0,`rgba(0,0,0,${a0})`);gr.addColorStop(1,`rgba(0,0,0,${a1})`);g.fillStyle=gr;polyG(g,p)};
  sh([[nx,ny],[bx,by],[bx,by+bh],[nx,ny+nh]],0,0,bx,0,.6,.2);
  sh([[nx+nw,ny],[bx+bw,by],[bx+bw,by+bh],[nx+nw,ny+nh]],w,0,bx+bw,0,.6,.2);
  sh([[nx,ny+nh],[nx+nw,ny+nh],[bx+bw,by+bh],[bx,by+bh]],0,h,0,by+bh,.65,.15);
  sh([[nx,ny],[nx+nw,ny],[bx+bw,by],[bx,by]],0,0,0,by,.55,.25);
  // 걸레받이
  const bb=bh*.035;g.fillStyle='rgba(38,28,10,.92)';g.fillRect(bx,by+bh-bb,bw,bb);
  polyG(g,[[bx,by+bh],[bx,by+bh-bb],[nx,ny+nh-bb*Zy],[nx,ny+nh]]);
  polyG(g,[[bx+bw,by+bh],[bx+bw,by+bh-bb],[nx+nw,ny+nh-bb*Zy],[nx+nw,ny+nh]]);
  // 모서리 어둠
  g.save();g.strokeStyle='rgba(0,0,0,.5)';g.lineWidth=3;g.shadowColor='#000';g.shadowBlur=14;
  [[nx,ny,bx,by],[nx+nw,ny,bx+bw,by],[nx,ny+nh,bx,by+bh],[nx+nw,ny+nh,bx+bw,by+bh]].forEach(([a,b,c,d])=>{g.beginPath();g.moveTo(a,b);g.lineTo(c,d);g.stroke()});

// ===================== 상태 =====================
function setMode(m){mode=m;document.body.dataset.mode=m;$('dbg').style.display=(m==='game'&&DEV.on&&DEV.info)?'block':'none'}
function newNight(n){
  S={night:n,t:0,power:100,san:100,view:1,mon:false,cam:0,door:false,light:true,brk:true,
     log:false,paused:true,over:false,msgT:0,shake:0,outSaid:false,silT:0,humOn:null,
     camX:1,monA:0,camSw:0,ring:0,ringT:rnd(60,150),monMsg:null,clockRev:0,sub:0,rattleT:0,h3:false,sw:Array(6).fill(true),bp:false,holding:false,hold:0,lockT:0,flickT:0,flOn:true,peek:null,ambT:rnd(6,12),hbT:0,dgT:0,
     layout:CAMS.map((_,i)=>({kind:KIND[i],ox:rnd(-.08,.08),oy:rnd(-.04,.04),seed:ri(1e9)})), // 밤마다 공간 구조가 바뀜
     hum:{node:[5,6,7][ri(3)],spot:0,timer:rnd(10,16),wait:0,lock:0},
     gaze:{cam:ri(8),p:0,timer:15},
     shadow:{p:0},
     clone:{cam:-1,t:0,timer:rnd(15,25)},
     fake:{cam:-1,type:'hum',timer:5},
     run:{open:0,phase:0,runT:0,cd:rnd(20,35),cr:0,slam:0,step:0},
     stat:{node:[4,5,6,7][ri(4)],spot:0,timer:rnd(16,24),enter:0,duct:-1,wait:0,bang:0,bangT:0,watch:0},vent:false,
     anom:[],anomT:rnd(25,40),repCD:0,outT:0,blackT:-1,call:null,storyDone:false,storyRing:false,missed:false,
     hard:HARD,mods:HARD?pickMods(n):[]};
  if(hasMod('black'))S.blackT=HOUR*rnd(1.5,4);if(hasMod('calls'))S.ringT=rnd(40,70);
  buildCams();buildViews();night3D(); // 밤마다 경비실도 조금씩 달라짐
  ['end','start','devp','log','brkp'].forEach(id=>$(id)&&$(id).classList.remove('show'));
  jump=0;document.body.classList.remove('scare');
  // (2일 차~ 밤 시작 컷씬) → 밤 시작 글자 → 근무 일지 → 닫으면 시간이 흐름
  const go2=()=>{if(!S||S.night!==n)return;setMode('game');buildUI();updHUD();
    {const tx=n+'일 차',el=$('introSmall');el.textContent='';let k=0;const iv=setInterval(()=>{k++;el.textContent=tx.slice(0,k);if(k>=tx.length)clearInterval(iv)},40)} // 한 글자씩
    const it=$('intro');it.classList.remove('show');void it.offsetWidth;it.classList.add('show');
    setTimeout(()=>{it.classList.remove('show');if(S&&S.night===n&&!S.over){S.view=S.camX=1;openLog()}},DEV.on?700:2400)};
  if(n>=2&&!DEV.on&&R3.ok)playCut(n===5?'night5_open':'night_start',go2,n);else go2();
}
function pickMods(n){const k=n<4?1:2,ids=Object.keys(MODS),out=[];while(out.length<k){const m=ids[ri(ids.length)];if(!out.includes(m))out.push(m)}return out}
const powered=()=>S.brk&&S.power>0&&!(S.outT>0);
const lightOn=()=>S.light&&powered();
const doorOn=()=>S.door&&S.power>0; // 빗장은 기계식이라 차단기가 내려가거나 정전이 와도 걸려 있음. 전력이 0%가 되면 풀림
const monOn=()=>S.mon&&powered();
const lightVis=()=>lightOn()&&S.flOn;

// ===================== 업데이트 (게임 규칙) =====================
function update(dt){
  if(S.over)return;
  S.t+=dt;
  if(S.t>=HOUR*6){win();return}

  // 전력
  if(powered()){
    const d=(.05+(S.light?.14:0)+(S.mon?.1:0)+(S.door?.25:0)+(S.vent?.16:0))*(hasMod('cold')?1.35:1);
    S.power=Math.max(0,S.power-d*dt);
  }
  if(S.power<=0&&!S.outSaid){S.outSaid=true;say('전기가 바닥났다.');sfx(50,1.5,'sawtooth',.2)}
  if(S.mon&&!powered()){S.mon=false;buildUI()}

  // 차단기
  if(S.brk&&S.power>0&&Math.random()<dt*.004*S.night*(S.hard?1:.6)*(hasMod('wire')?2.2:1)){
    S.brk=false;S.sw=Array(6).fill(true);for(let k=0,n=Math.min(5,1+S.night);k<n;){const i=ri(6);if(S.sw[i]){S.sw[i]=false;k++}}say(S.door?'딸깍. 차단기가 내려갔다. 빗장은 그대로다.':'딸깍. 차단기가 내려갔다.');sfx(90,.3,'square',.2);buildUI();
  }

  // 교대자: 지도를 따라 관측실로 다가옴. 문 앞에 서면 형광등 소리가 끊김
  const h=S.hum;
  if(h.node!==DOOR){
    h.timer-=dt;
    if(h.timer<=0){
      h.timer=Math.max(3.5,rnd(7,12)-S.night)*(hasMod('fast')?.78:1)+(S.hard?0:1.5);
      const prev=h.node;
      if(h.spot<2&&Math.random()<.45)h.spot++;            // 같은 구역에서 카메라 쪽으로 다가옴
      else if(h.node===0){h.node=DOOR;h.wait=0;h.lock=0}  // A에서 문 앞으로
      else{const nb=ADJ[h.node],w=nb.map(n=>DIST[n]<DIST[h.node]?3+S.night*.5:1);let r=Math.random()*w.reduce((a,b)=>a+b,0),k=0;while(k<w.length-1&&r>w[k]){r-=w[k];k++}h.node=nb[k];h.spot=0}
      humMoved(prev);
    }
  }else{
    if(doorOn()){
      h.lock+=dt;
      if(h.lock>=4){achCount('bolt',10,'bolt');if(S.lieDoor){S.lieDoor=false;ach('lie')}h.node=[5,6,7][ri(3)];h.spot=0;h.timer=Math.max(3.5,rnd(7,12)-S.night);sfx(200,.15,'sine',.1);say('형광등 소리가 돌아왔다.')}
    }else{
      h.wait+=dt;
      if(h.wait>=(S.hard?5.5:6.5)-S.night*.5)return die('교대자');
    }
  }

  // 은둔자 (2일 차~)
  if(S.night>=2){const st=S.stat;
    if(st.duct<0){ // CCTV 구역을 돌아다님
      const seen=monOn()&&S.cam===st.node;
      if(seen){st.watch+=dt;S.san-=dt*.35}else st.watch=0;
      if(VENT_Z.includes(st.node)&&st.spot>=1){
        if(seen){if(st.enter>1.5)st.blk=1;st.enter=Math.max(0,st.enter-dt*2);if(st.blk&&st.enter<=0){st.blk=0;ach('crawl')}}              // 보고 있으면 못 들어감
        else{st.enter+=dt;if(st.enter>=(S.hard?3:4.5)){st.duct=0;st.enter=0;st.spot=0;ventIn(st.node)}}
      }
      st.timer-=dt;
      if(st.timer<=0&&st.duct<0&&!(seen&&st.watch<2.5)){
        st.timer=rnd(8,13)-S.night*.6+(S.hard?0:2);const prev=st.node;
        if(st.spot<1&&Math.random()<.55)st.spot++;
        else{const nb=ADJ[st.node].filter(n=>n!==S.hum.node),c=nb.length?nb:ADJ[st.node],w=c.map(n=>VENT_Z.includes(n)?3:1);let r=Math.random()*w.reduce((a,b)=>a+b,0),k=0;while(k<w.length-1&&r>w[k]){r-=w[k];k++}st.node=c[k];st.spot=0}
        if(monOn()&&(S.cam===prev||S.cam===st.node))S.camSw=Math.max(S.camSw,.5);
        nburst(2000,4,.12,.05,(MAPP[st.node][0]-50)/50);
      }
    }else if(st.duct<1){ // 덕트 안을 기어 옴
      st.duct=Math.min(1,st.duct+dt/(Math.max(11,(S.hard?20:26)-S.night*2)));
      if(Math.random()<dt*(.4+st.duct*1.6)){thump(80+rnd(-10,10),.12,.06+st.duct*.18,.75);nburst(700,3,.1,.03+st.duct*.1,.75)}
      if(st.duct>=1){st.wait=0;st.bang=0;st.bangT=0}
    }else{ // 경비실 환풍구 앞
      if(S.vent){st.bangT-=dt;if(st.bangT<=0){st.bangT=1.15;st.bang++;thump(60,.35,.45,.8);nburst(1500,2,.15,.25,.8);if(S.view===2)S.shake=.22}
        if(st.bang>=4){achCount('vent',5,'vent');st.duct=-1;st.node=[5,6,7][ri(3)];st.spot=0;st.timer=rnd(12,18);say('환풍구 안이 조용해졌다.');sfx(300,.2,'sine',.05)}}
      else{st.wait+=dt;if(Math.random()<dt*3)nburst(900,5,.08,.12,.8);if(st.wait>=(S.hard?2.4:3.4))return die('은둔자')}
    }
    if(S.vent){S.san-=dt*.3}
    radioTick(dt,st.duct<0?(st.enter>0?.15:0):st.duct<1?.2+st.duct*.8:1);
  }

  // 질주자 (3일 차~): 창고 문을 안 보는 동안 문틈이 벌어짐. 다 열리면 통로 안에서 달려옴. 그 전에 문을 닫아야 함 (전력과 무관)
  if(S.night>=3){const r=S.run,watch=S.view===2&&Math.abs(S.camX-2)<.3&&!monOn()&&!S.log&&!S.bp;
    if(r.slam>0)r.slam-=dt;
    if(r.phase===0){
      if(r.cd>0)r.cd-=dt;
      else if(watch)r.open=Math.max(0,r.open-dt*.015);             // 보고 있으면 안 열림 (아주 천천히 닫히기까지)
      else r.open=Math.min(1,r.open+dt/((S.hard?24:32)-S.night*3));
      const c=Math.floor(r.open*4);if(c>r.cr){r.cr=c;creakStore(c)}else if(c<r.cr)r.cr=c;
      if(r.open>=1){r.phase=1;r.runT=S.hard?2.6:3.4;r.step=0;runStart()}
    }else{
      r.runT-=dt;r.step-=dt;const k=1-r.runT/(S.hard?2.6:3.4);
      if(r.step<=0){r.step=lerp(.22,.11,k);runStep(k)}
      if(r.runT<=0)return die('질주자');
    }
  }

  // 응시자 (2일 차~): 같은 카메라를 오래 보면 위험
  if(S.night>=2){
    const g=S.gaze;
    g.timer-=dt;
    if(g.timer<=0&&g.p<20){g.cam=ri(8);g.timer=rnd(12,20)}
    if(monOn()&&S.cam===g.cam){g.p+=dt*(S.hard?12+S.night*3:10+S.night*2);S.san-=dt*1.5}
    else g.p=Math.max(0,g.p-dt*10);
    if(g.p>50&&!g.sq){g.sq=1;squelch(0,.3)}if(g.p<20)g.sq=0; // 눈이 움직이는 질척한 소리
    if(g.p>90)g.hi=1;if(g.hi&&g.p<15){g.hi=0;ach('eye')}
    if(g.p>=100)return die('응시자');
  }

  // 그림자 (3일 차~): 조명이 꺼지면 다가옴
  if(S.night>=3){
    const s=S.shadow;
    s.p=lightOn()?Math.max(0,s.p-dt*7):s.p+dt*(S.hard?3+S.night:2.4+S.night*.75);
    if(s.p>60&&!s.br){s.br=1;breathe(rnd(-1,1),.3)}if(s.p<30)s.br=0; // 어둠 속 숨소리
    if(s.p>=100)return die('그림자');
  }

  // 복제자 (4일 차~): 신고하지 않으면 정신력 크게 감소
  if(S.night>=4){
    const c=S.clone;
    if(c.cam<0){c.timer-=dt;if(c.timer<=0){c.cam=ri(8);c.t=0;giggle(rnd(-1,1))}}
    else{
      c.t+=dt;
      if(c.t>=(S.hard?25:35)){c.cam=-1;c.timer=rnd(15,25);S.san-=S.hard?35:25;say('화면 속 내가 자리에서 일어났다.','bad');sfx(60,1,'sawtooth',.15)}
    }
  }

  // 이상 현상 (2일 차~): 아무도 안 볼 때 CCTV 어딘가가 바뀜. 신고하지 않으면 정신력이 크게 깎임
  if(S.night>=2){
    S.anomT-=dt;
    if(S.anomT<=0){S.anomT=S.hard?Math.max(14,rnd(28,46)-S.night*3):rnd(40,60);const free=[...Array(8).keys()].filter(i=>!S.anom.some(a=>a.cam===i)&&!(monOn()&&S.cam===i)&&S.clone.cam!==i);
      if(S.anom.length<(S.hard&&S.night>=4?2:1)&&free.length){const types=['chair','door','blood','figure','writing','redlight'];S.anom.push({cam:free[ri(free.length)],type:types[ri(types.length)],t:0,txt:ANOM_TXT[ri(ANOM_TXT.length)]});if(Math.random()<.5)creak()}}
    for(let k=S.anom.length-1;k>=0;k--){const a=S.anom[k];a.t+=dt;if(a.t>=(S.hard?42:60))S.anom.splice(k,1)} // 분위기용: 그냥 사라짐
  }

  SET_ROWS.forEach(r=>{const row=document.createElement('div');row.className='srow';const lab=document.createElement('div');lab.className='sl';lab.textContent=r.t;if(r.d){const sm=document.createElement('small');sm.textContent=r.d;lab.appendChild(sm)}row.appendChild(lab);
    if(r.opts){const sg=document.createElement('div');sg.className='seg';r.opts.forEach(([v,t])=>{const b=document.createElement('button');b.textContent=t;if(SET[r.k]===v)b.className='on';b.onclick=e=>{e.stopPropagation();SET[r.k]=v;saveSet();buildSet();sfx(900,.03,'square',.04)};sg.appendChild(b)});row.appendChild(sg)}
    else{const inp=document.createElement('input');inp.type='range';inp.min=r.min;inp.max=r.max;inp.step=r.step;inp.value=SET[r.k];const val=document.createElement('span');val.className='sv';
      const upd=()=>{val.textContent=r.f(+inp.value);inp.style.setProperty('--p',((inp.value-r.min)/(r.max-r.min)*100)+'%')};upd();
      inp.oninput=()=>{SET[r.k]=+inp.value;upd();applySet()};inp.onchange=()=>{saveSet();if(r.k!=='bright')sfx(700,.05,'sine',.05)};row.appendChild(inp);row.appendChild(val)}
    box.appendChild(row)});
}
function openSettings(){buildSet();$('settings').classList.add('show')}
function closeSettings(){$('settings').classList.remove('show')}
$('sBack').onclick=closeSettings;$('sReset').onclick=()=>{SET=Object.assign({},SET_DEF);saveSet();buildSet()};
$('mSet').onclick=openSettings;
// ===================== 일시정지 (ESC, 화면 위 가운데 버튼) =====================
const PAUSE={on:false,confirm:false};
function openPause(){
  if(mode!=='game'||!S||S.over||jump>0||PAUSE.on)return;PAUSE.on=true;PAUSE.confirm=false;$('pMenu').textContent='메인 메뉴로';$('pMenu').classList.remove('warn');
  const hr=Math.floor(S.t/HOUR);$('pauseSub').textContent=`${S.night}일 차 · ${hr===0?12:hr}:${String(Math.floor((S.t%HOUR)/HOUR*6)*10).padStart(2,'0')} AM${S.hard?' · 하드':''}`;
  $('pLog').style.display=S.mon||S.bp?'none':'block';$('pause').classList.add('show');if(AC&&AC.state==='running')AC.suspend();
}
function closePause(){if(!PAUSE.on)return;PAUSE.on=false;$('pause').classList.remove('show');closeSettings();if(AC&&AC.state==='suspended')AC.resume()}
$('pauseBtn').onclick=e=>{e.stopPropagation();openPause()};
$('pResume').onclick=closePause;$('pSet').onclick=openSettings;
$('pLog').onclick=()=>{closePause();if(S&&!S.log){S.view=S.camX=1;openLog()}};
$('pMenu').onclick=()=>{if(!PAUSE.confirm){PAUSE.confirm=true;$('pMenu').textContent='정말? 이번 밤은 처음부터 다시 해야 함';$('pMenu').classList.add('warn');return}closePause();toMenu()};
addEventListener('keydown',e=>{if(e.key!=='Escape')return;
  if($('settings').classList.contains('show')){closeSettings();return}
  if(mode!=='game'||!S)return;
  if(PAUSE.on)closePause();else if(S.log)closeLog();else if(S.bp)closeBrk();else if(S.mon)toggleMon();else openPause()});
document.addEventListener('visibilitychange',()=>{if(document.hidden)openPause()}); // 다른 앱으로 나가면 자동 일시정지
// ===================== 메뉴 / 개발자 모드 =====================
function toMenu(){
  if(PAUSE.on)closePause();
  if(S){S.over=true;if(radioG)radioG.gain.setTargetAtTime(0,AC.currentTime,.05);if(humG)humG.gain.setTargetAtTime(0,AC.currentTime,.05)}
  document.body.classList.remove('scare');S=null;['end','devp','log','intro','brkp'].forEach(id=>$(id).classList.remove('show'));
  $('mCont').style.display=savedNight>1?'block':'none';$('mCont').textContent=`이어하기 (${savedNight}일 차)`;
  $('mHard').textContent=`하드 모드${savedHard>1?` (${savedHard}일 차)`:''}`;
  setMode('menu');if(staticG)staticG.gain.setTargetAtTime(.04,AC.currentTime,.3);
}
function startGame(n,dev,hard=false){initAudio();DEV.on=dev;HARD=dev?DEV.hard:hard;DEV.speed=1;if(staticG)staticG.gain.setTargetAtTime(0,AC.currentTime,.1);newNight(n);buildDbg()}
// 3D 엔진(700KB)이 아직 오는 중이면 잠깐 기다렸다 시작. 안 그러면 느린 폰 회선에서 2D 방으로 시작됨
let going=false;
function go(fn){
  if(going)return;if(R3.state!=='wait')return fn();
  going=true;const t0=performance.now(),iv=setInterval(()=>{if(R3.state==='wait'&&performance.now()-t0<10000)return;
    clearInterval(iv);going=false;if(R3.state==='wait'){R3.state='fail';R3.why='3D 로딩이 너무 느림';updFoot()}fn()},100); // 늦게라도 오면 게임 중에 3D로 바뀜
}
function updFoot(){const f=$('foot'),st=R3.state;f.textContent=`v${VER}`+(st==='wait'?' · 불러오는 중':st==='fail'?' · 2D 모드 ('+R3.why+')':'');f.classList.toggle('warn',st==='fail')}
$('mNew').onclick=()=>go(()=>{if(R3.ok)playCut('intro',()=>startGame(1,false),1);else startGame(1,false)});
$('mCont').onclick=()=>go(()=>startGame(savedNight,false));
$('mHard').onclick=()=>go(()=>startGame(savedHard,false,true));
$('mDev').onclick=()=>$('devp').classList.add('show');
$('devBack').onclick=()=>$('devp').classList.remove('show');
[['인트로','intro',1],['밤 시작','night_start',3],['5일 차 시작','night5_open',5],['6시','reset',2],['엔딩','ending',5],['하드 엔딩','ending_hard',5]].forEach(([t,id,n])=>{const b=document.createElement('button');b.textContent=t;b.onclick=()=>devCut(id,n);$('devCuts').appendChild(b)});
function devCut(id,n){if(!R3.ok)return;$('devp').classList.remove('show');if(id==='intro'){playCut(id,toMenu,1);return}startGame(n,true);S.over=true;$('intro').classList.remove('show');playCut(id,toMenu,n)}
$('endMenu').onclick=toMenu;
for(let n=1;n<=NIGHTS;n++){const b=document.createElement('button');b.textContent=n+'일 차';b.onclick=()=>go(()=>startGame(n,true));$('devNights').appendChild(b)}
[['dHard','hard'],['dNoScare','noScare'],['dInfo','info'],['dGod','god'],['dBright','bright']].forEach(([id,k])=>{$(id).onchange=e=>{DEV[k]=e.target.checked;buildDbg()}});
$('dbgTog').onclick=e=>{e.stopPropagation();const d=$('dbg');d.classList.toggle('min');$('dbgTog').textContent=d.classList.contains('min')?'DEV ▸':'DEV ▾'};
function buildDbg(){
  const box=$('dbgBtns');box.innerHTML='';
  const mb=(t,f,on)=>{const b=document.createElement('button');b.textContent=t;if(on)b.className='on';b.onclick=e=>{e.stopPropagation();f();buildDbg()};box.appendChild(b)};
  [1,2,4,8].forEach(s=>mb(s+'x',()=>DEV.speed=s,DEV.speed===s));
  mb('무적',()=>DEV.god=!DEV.god,DEV.god);
  mb('밝게',()=>DEV.bright=!DEV.bright,DEV.bright);
  mb('6시로',()=>{if(S&&!S.over)S.t=HOUR*6-3});
  mb('메뉴',toMenu);
  $('dbg').style.display=(mode==='game'&&DEV.on&&DEV.info)?'block':'none';
  $('dbgTog').textContent=$('dbg').classList.contains('min')?'DEV ▸':'DEV ▾';
}
function updDbg(){
  const h=S.hum,g=S.gaze,s=S.shadow,c=S.clone,n=S.night;
  $('dbgText').textContent=
`[DEV] ${n}일 차 · ${DEV.speed}x
교대자: ${h.node===DOOR?'문 앞!':'CAM '+CAMS[h.node]+' (위치 '+h.spot+')'} · 이동 ${h.timer.toFixed(1)}s
  대기 ${h.wait.toFixed(1)} / 잠금 ${h.lock.toFixed(1)}
응시자: ${n>=2?'CAM '+CAMS[g.cam]+' · '+(g.p|0)+'%':'-'}
은둔자: ${n>=2?(S.stat.duct<0?'CAM '+CAMS[S.stat.node]+' ('+S.stat.spot+(S.stat.enter>0?' 진입 '+S.stat.enter.toFixed(1):'')+')':S.stat.duct<1?'덕트 '+(S.stat.duct*100|0)+'%':'환풍구 앞! '+S.stat.wait.toFixed(1)):'-'}${S.vent?' [닫힘]':''}
질주자: ${n>=3?(S.run.phase?'달려옴! '+S.run.runT.toFixed(1)+'s':'문틈 '+(S.run.open*100|0)+'%'+(S.run.cd>0?' (대기 '+S.run.cd.toFixed(0)+')':'')):'-'}
그림자: ${n>=3?(s.p|0)+'%':'-'}
복제자: ${n>=4?(c.cam<0?'없음 ('+c.timer.toFixed(0)+'s)':'CAM '+CAMS[c.cam]+' · '+c.t.toFixed(0)+'s'):'-'}
전력 ${S.power.toFixed(1)} · 정신 ${S.san.toFixed(1)}
가짜: ${S.fake.cam<0?'-':'CAM '+CAMS[S.fake.cam]}
이상: ${S.anom.map(x=>CAMS[x.cam]+' '+x.type+' '+(x.t|0)+'s').join(', ')||'-'}
특이: ${S.mods.map(m=>MODS[m][0]).join(', ')||'-'}${S.call?' · 통화중':''}${S.missed?' · 부재중':''}`;
}
// 타이틀 글리치
setInterval(()=>{if(mode!=='menu'||Math.random()>.3)return;const t=$('title');t.classList.add('glitch');setTimeout(()=>t.classList.remove('glitch'),80+Math.random()*120)},700);

buildMap();updFoot();applySet();
texReady.then(()=>{READY=true;resize();buildJumps();init3D()});
addEventListener('three',()=>init3D()); // 3D 엔진이 늦게 오면 그때 시작
if(window.THREE_ERR)init3D();
// 예전 버전이 캐시에 남아 있으면(디스코드 앱 안 브라우저 등) 새 버전으로 한 번 새로고침. 버전은 이 파일의 VER로 비교
function checkVer(){
  if(location.protocol==='file:')return;
  fetch(location.pathname,{cache:'no-cache'}).then(r=>r.ok?r.text():'').then(t=>{
    const v=(t.match(/const VER='([^']+)'/)||[])[1];if(!v||v===VER||mode!=='menu')return;
    const k='awful_ver_'+v;try{if(sessionStorage.getItem(k))return;sessionStorage.setItem(k,'1')}catch(e){return}
    location.replace(location.pathname+'?v='+encodeURIComponent(v)+location.hash);
  }).catch(()=>{});
}
checkVer();addEventListener('pageshow',e=>{if(e.persisted)checkVer()});
try{Promise.all(["40px 'Nanum Pen Script'","20px 'Nanum Gothic Coding'"].map(f=>document.fonts.load(f))).then(()=>{if(READY)buildViews()}).catch(()=>{})}catch(e){} // 손글씨 폰트가 늦게 오면 방을 다시 그림
toMenu();
if(/[?&]test/.test(location.search))$('devp').classList.add('show');

// ===================== 루프 =====================
function loop(ts){
  const dt=Math.min(.05,(ts-last)/1000||0);last=ts;T_=ts/1000;
  if(mode==='menu')renderMenu(dt);
  else if(mode==='game'&&S){
    if(!S.paused&&!PAUSE.on)update(dt*(DEV.on?DEV.speed:1));
    if(S&&!SET.shake)S.shake=0;
    if(S&&!PAUSE.on)animate(dt);
    if(jump>0){jump-=dt;drawJump()}else if(S)render();
    if(S&&mode==='game')drawEKG(dt);
    if(S&&DEV.on&&DEV.info)updDbg();
    if(S&&S.mon)updMapDot();
  }else if(mode==='cut'&&CUT.id)renderCut(dt);
  else renderStatic();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
